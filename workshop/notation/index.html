<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notation workshop</title>
<style>
  :root { --ink: #1b1b1b; --muted: #6b6b6b; --line: #d9d9d9; --panel: #f5f4f1; --accent: #c2127a; --loop: #1f6fb5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 12.5px/1.25 system-ui, "Segoe UI", sans-serif; }
  .bar { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; padding: 5px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar.two { background: #fff; padding: 4px 10px; }
  .g { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .g label, .dim { color: var(--muted); }
  input[type=range] { width: 110px; margin: 0; }
  input[type=number] { width: 68px; padding: 2px 4px; font: inherit; font-variant-numeric: tabular-nums; }
  input.s { width: 46px; }
  select, button { font: inherit; padding: 2px 8px; }
  button { border: 1px solid #b9b9b9; border-radius: 4px; background: #fff; cursor: pointer; }
  button.main { background: var(--ink); color: #fff; border-color: var(--ink); }
  output, b.n { font-variant-numeric: tabular-nums; display: inline-block; min-width: 40px; }
  #msg { color: var(--muted); margin-left: auto; }
  #msg a { color: var(--loop); }
  #stage { position: relative; margin: 6px 10px 0; border: 1px solid var(--line); overflow: hidden; cursor: crosshair; background: #fff; min-height: 80px; user-select: none; }
  #stage svg { display: block; }
  #cursor, #la, #lb, #hover { position: absolute; top: 0; bottom: 0; width: 0; pointer-events: none; }
  #cursor { border-left: 3px solid var(--accent); }
  #la, #lb { border-left: 2px dashed var(--loop); }
  #shade { position: absolute; top: 0; bottom: 0; background: rgba(31, 111, 181, .07); pointer-events: none; }
  #hover { border-left: 1px solid #999; display: none; }
</style>
</head>
<body>
<div class="bar">
  <div class="g"><button id="play" class="main" title="SPACE">▶ Play</button><button id="stop" title="Back to the start">■</button></div>
  <div class="g"><label for="rate">Speed</label><input id="rate" type="range" min="0.2" max="1.5" step="0.05"><output id="rateO"></output></div>
  <div class="g"><label for="span" title="How many seconds stand across the page. Fewer seconds = more room between the notes.">Stretch</label><input id="span" type="range" min="1" max="24" step="0.1"><output id="spanO"></output></div>
  <div class="g"><label for="size">Size</label><input id="size" type="range" min="0.8" max="4" step="0.05"><output id="sizeO"></output></div>
  <div class="g"><label for="loopOn">Loop</label><input id="loopOn" type="checkbox"><button id="fit" title="Show just the selected phrase">Fit phrase</button></div>
  <div class="g"><button id="clip" class="main">Make video</button><label for="loops">×</label><input id="loops" class="s" type="number" min="1" max="20" step="1"></div>
</div>
<div class="bar two">
  <div class="g"><select id="page"><option value="work">working version</option><option value="s2-piano-solo">spaced</option><option value="s2-piano-solo-played">as played</option><option value="s2-piano-solo-heads">heads only</option><option value="gravity-proto">prototype: ribbon</option><option value="gravity-proto-strobe">prototype: strobe</option><option value="burst">scattered strike</option><option value="chords-sets">chords: pitch sets</option><option value="both-across">both hands: ribbon</option></select></div>
  <div class="g"><label for="t0">Page from</label><input id="t0" type="number" step="0.1"><button id="back" title="LEFT">◀</button><button id="fwd" title="RIGHT">▶</button></div>
  <div class="g"><label for="a">Phrase</label><input id="a" type="number" step="0.01"><span class="dim">to</span><input id="b" type="number" step="0.01"></div>
  <div class="g"><label for="gap">Gap</label><input id="gap" class="s" type="number" step="0.5" min="0"></div>
  <div class="g"><label for="marksOn" title="Walls (amber) and the two hands' arcs: the first sorting, yours to correct">Gravity</label><input id="marksOn" type="checkbox"></div>
  <div class="g dim">cursor <b class="n" id="tNow">–</b> mouse <b class="n" id="tHover">–</b></div>
  <div class="g" id="subBox" style="display:none"><label for="sub">Substrate</label><select id="sub"></select><label for="dens">×</label><input id="dens" class="s" type="number" min="3" max="400" step="2"></div>
  <div class="g dim" id="help">drag on the score = select a phrase · click = cursor</div>
  <div id="msg"></div>
</div>

<div id="stage">
  <div id="svgBox"></div>
  <svg id="marks" style="position:absolute;left:0;top:0;pointer-events:none"></svg>
  <div id="shade"></div>
  <div id="la"></div>
  <div id="lb"></div>
  <div id="hover"></div>
  <div id="cursor"></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'notationWorkshop.v2';
  const S = Object.assign({ page: 's2-piano-solo', t0: 147.4, span: 8, size: 1.5, rate: 1, a: 147.9, b: 152, loopOn: false, gap: 2, loops: 1, marksOn: true }, (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })());
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  let V = null, INFO = { a0: 146, a1: 258, window: [146, 253] }, t = S.a, playing = false, waitUntil = 0, fetchN = 0, timer = 0, turning = false;   // turning: a page turn has been asked for and its picture is not here yet
  const audio = new Audio('/audio'); audio.preload = 'auto'; audio.preservesPitch = true;
  const msg = h => { $('msg').innerHTML = h || ''; };
  const fmt = x => (+x).toFixed(2);

  // ---- the picture
  const stageW = () => $('stage').clientWidth || Math.max(300, window.innerWidth - 22);
  function load() {
    const n = ++fetchN, w = Math.max(300, Math.round(stageW() / S.size));
    fetch('/view?page=' + encodeURIComponent(S.page) + '&t0=' + S.t0 + '&span=' + S.span + '&w=' + w + '&sub=' + encodeURIComponent(S.sub || '') + '&n=' + (S.dens || 0)).then(r => r.json()).then(v => {
      // the substrate's two controls show only where a curtain is on the page
      $('subBox').style.display = v.strike ? 'flex' : 'none';
      if (v.strike) { const sel = $('sub'); if (!sel.options.length) for (const k of v.strike.all) { const o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o); } sel.value = v.strike.species; $('dens').value = v.strike.rocks.length; }
      if (n !== fetchN) return;
      if (v.error) { msg('The page could not be drawn: ' + v.error); return; }
      v.protos = v.protos || (v.proto ? [v.proto] : []); v.strikes = v.strikes || (v.strike ? [v.strike] : []);   // a page may carry several ribbons and several strikes
      V = v; turning = false; $('svgBox').innerHTML = v.svg;
      const svg = $('svgBox').querySelector('svg');
      svg.style.width = (v.w * S.size) + 'px'; svg.style.height = (v.band[1] * S.size) + 'px';
      if (v.proto) for (const el of svg.querySelectorAll('g.sys path, g.sys use')) { const b = el.getBoundingClientRect(), o = svg.getBoundingClientRect(), k = S.size; if (b.width < 16 * k && b.height < 16 * k && b.left - o.left > (v.x0 - 4) * k) el.style.opacity = v.proto.headOpacity; }   // the note heads, lighter
      place(); drawMarks();
    }).catch(e => msg('The workshop server does not answer.'));
    fetch('/marks').then(r => r.json()).then(m => { M = m; drawMarks(); }).catch(() => {});
  }
  const later = () => { clearTimeout(timer); timer = setTimeout(load, 120); };
  const xOf = s => V ? (V.x0 + (s - V.window[0]) * V.pps) * S.size : -10;
  const tOf = x => V ? V.window[0] + (x / S.size - V.x0) / V.pps : 0;
  // ---- the gravity marks (bank/gravity_sort.json): WALLS = amber upright boxes on the hand's staff · an ARC per flow of one hand, the
  // right hand's above the upper staff, the left hand's below the lower, its low point the bounce · a ball rides the arc while it plays
  let M = { walls: [], arcs: [] };
  const COL = { R: '#0b8f86', L: '#7a3fc2', wall: '#e08a00' };
  const yPx = y => (y - V.band[0]) * S.size;
  function arcGeom(a) {   // the lane an arc lives in: from its far edge (the ball's height) to the staff's outer line (the bounce)
    const up = a.hand === 'R', st = V.staves[up ? 0 : V.staves.length - 1]; if (!st) return null;
    const ss = (st[1] - st[0]) / 4, touch = up ? st[0] - 1.2 * ss : st[1] + 1.2 * ss, far = up ? V.band[0] + 3 : V.band[0] + V.band[1] - 3;
    return { touch, far };
  }
  function arcY(a, s) {   // a ball's height at time s: it falls from rest into the bounce, and leaves it fast, slowing to rest
    const g = arcGeom(a); if (!g) return null;
    let h;
    if (s <= a.bounce) { const d = a.bounce - a.t0; h = d > 0 ? 1 - Math.pow((s - a.t0) / d, 2) : 0; }
    else { const d = a.t1 - a.bounce, v = d > 0 ? (s - a.bounce) / d : 1; h = 1 - Math.pow(1 - v, 2); }
    return g.touch + (g.far - g.touch) * Math.max(0, Math.min(1, h));
  }
  // ---- THE PROTOTYPE (bank/gravity_proto.json): ONE arc, the lineage's GC — the fall 1 - u^p into the impact, the rebound to damping %
  function gcFrac(p, s) {
    const a = p.arc, pr = p.preset, dp = 1 + (pr.ictus / 1000) * 20, ap = 1 + pr.stiffness / 50, rb = pr.damping / 100, cl = u => Math.max(0, Math.min(1, u));
    if (p.wave) { const wkA = [].concat(p.sharp || 1), shpK = (h, wk) => wk === 1 ? h : Math.pow(h, wk) / (Math.pow(h, wk) + Math.pow(1 - h, wk)), shp = h => shpK(h, wkA[0]), shpUp = h => shpK(h, wkA[wkA.length - 1]);   // sharp: steeper sides (§330); a pair = [down, up] (§332)
      if (s <= a.bounce) { const d = a.bounce - a.t0; return shp((1 + Math.cos(Math.PI * cl(d > 0 ? (s - a.t0) / d : 1))) / 2); } const d2 = a.t1 - a.bounce; return rb * shpUp((1 - Math.cos(Math.PI * cl(d2 > 0 ? (s - a.bounce) / d2 : 1))) / 2); }   // a wave turns smoothly (§323)
    if (s <= a.bounce) { const d = a.bounce - a.t0; return 1 - Math.pow(cl(d > 0 ? (s - a.t0) / d : 1), dp); }
    const d = a.t1 - a.bounce; return rb * (1 - Math.pow(1 - cl(d > 0 ? (s - a.bounce) / d : 1), ap));
  }
  const gcY = (p, s) => { const B = p.arcBand || V.band, imp = p.arcY ? p.arcY.imp : B[0] + B[1] - 8, apex = p.arcY ? p.arcY.apex : B[0] + 8; return imp - gcFrac(p, s) * (imp - apex); };
  // the ball shows outside the ribbon: the GC's own radius, or 1.35 x the ribbon's half width where it rides + 2 px, whichever is larger
  function ballR(p, s) {
    const base = p.look.ballRadiusPx, rb = p.ribbon; if (!rb || !rb.length) return base;
    let h = rb[rb.length - 1][1]; for (let i = 1; i < rb.length; i++) if (s <= rb[i][0]) { const a = rb[i - 1], b = rb[i], u = b[0] > a[0] ? (s - a[0]) / (b[0] - a[0]) : 0; h = a[1] + (b[1] - a[1]) * Math.max(0, Math.min(1, u)); break; }
    return Math.max(base, ((p.flow && p.flow.ballOverRibbon) || 1.35) * h + 2);
  }
  function drawProto() {
    const el = $('marks'), p = V.proto, a = p.arc, k = S.size, out = [], pts = [], n = 160;
    el.setAttribute('width', V.w * k); el.setAttribute('height', V.band[1] * k);
    for (let i = 0; i <= n; i++) { const s = a.t0 + (a.t1 - a.t0) * i / n; pts.push(xOf(s).toFixed(1) + ',' + yPx(gcY(p, s)).toFixed(1)); }
    const bi = pts.length; for (let i = 0; i <= 12; i++) { const s = a.bounce - 0.004 + 0.008 * i / 12; }   // (the corner at the impact is in the samples' own step)
    // (the arc, its ring, the flow and the shapes are in the picture itself — the server draws them, so the film has them; here only the ball)
    out.push('<g id="balls"></g>');
    el.innerHTML = out.join(''); balls();
  }
  // ---- THE SCATTERED STRIKE's PEBBLES (the page "scattered strike"; the curtain is in the picture): a handful at rest at the curtain's
  // foot; it RISES together through prepS before the strike (the backswing, the GC's own rise curve) and each pebble then DROPS at its own
  // moment across the strike (the GC's own fall curve), drifting to its own place
  function pebblesSvg(K) {
    // THE THROW (§299): every pebble a parabola — height = H · 4u(1 − u) over its own flight — from the hand at the curtain's foot, landing
    // about the impact (the cursor at the curtain's middle), then one small bounce, then still
    const out = [], e = K.bounce;
    for (const p of K.rocks) {
      const tl = p.tl != null ? p.tl : K.impact - K.flightS + p.dly, u = (t - tl) / p.T, yl = p.yl || 0; let x, y, air;   // tl · yl: a hill's pebble has its own moment and lands back on its pile (§317)
      if (u < 0) { x = p.xh; y = K.floor - p.yh; air = 0; }
      else if (u <= 1) { x = p.xh + (p.xl - p.xh) * u; y = K.floor - yl - p.H * 4 * u * (1 - u); air = t - tl; }
      else { const tb = t - tl - p.T, Tb = p.T * e, ub = tb / Tb, dx = (p.xl - p.xh) * e * 0.5;
        if (ub < 1) { x = p.xl + dx * ub; y = K.floor - yl - p.H * e * e * 4 * ub * (1 - ub); air = p.T + tb; } else { x = p.xl + dx; y = K.floor - yl; air = p.T + Tb; } }
      const c = 'rgb(' + p.gray + ',' + p.gray + ',' + p.gray + ')';
      out.push('<path d="' + p.d + '" transform="translate(' + (x * S.size).toFixed(1) + ' ' + yPx(y - p.r * 0.6).toFixed(1) + ') rotate(' + (p.spin * air).toFixed(0) + ') scale(' + S.size + ')" ' + (K.stroked ? 'fill="none" stroke="' + c + '" stroke-width="0.6"' : 'fill="' + c + '"') + '/>');
    }
    return out.join('');
  }
  function drawMarks() {
    if (V && (V.protos.length || V.strikes.length)) { const el2 = $('marks'); el2.setAttribute('width', V.w * S.size); el2.setAttribute('height', V.band[1] * S.size); el2.innerHTML = '<g id="balls"></g>'; return balls(); }
    const el = $('marks'); if (!V || !V.staves || !V.staves.length || !S.marksOn || /^(chords-|burst|both-)/.test(S.page)) { el.innerHTML = ''; return; }   // the first sorting's walls and arcs are never drawn on the chord or burst pages
    const W = V.w * S.size, H = V.band[1] * S.size, a0 = V.window[0], a1 = V.window[1], out = [];
    el.setAttribute('width', W); el.setAttribute('height', H);
    for (const w of M.walls || []) {
      if (w.t1 < a0 || w.t > a1) continue;
      const hs = w.hands.includes('R') && w.hands.includes('L') ? [V.staves[0][0], V.staves[V.staves.length - 1][1]] : w.hands === 'R' ? V.staves[0] : V.staves[V.staves.length - 1];
      const ss = (V.staves[0][1] - V.staves[0][0]) / 4, x = xOf(w.t) - 3, wd = Math.max(8, xOf(w.t1) - xOf(w.t) + 1.3 * ss * S.size + 6);
      out.push('<rect x="' + x.toFixed(1) + '" y="' + yPx(hs[0] - ss).toFixed(1) + '" width="' + wd.toFixed(1) + '" height="' + ((hs[1] - hs[0] + 2 * ss) * S.size).toFixed(1) + '" rx="2" fill="' + COL.wall + '" fill-opacity="0.16" stroke="' + COL.wall + '" stroke-width="1.5"/>');
    }
    for (const a of M.arcs || []) {
      if (a.t1 < a0 || a.t0 > a1) continue;
      const pts = [], n = 40; for (let i = 0; i <= n; i++) { const s = a.t0 + (a.t1 - a.t0) * i / n, y = arcY(a, s); if (y == null) break; pts.push(xOf(s).toFixed(1) + ',' + yPx(y).toFixed(1)); }
      const yb = arcY(a, a.bounce);
      out.push('<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + COL[a.hand] + '" stroke-width="2" stroke-opacity="0.85"/>');
      if (yb != null) out.push('<circle cx="' + xOf(a.bounce).toFixed(1) + '" cy="' + yPx(yb).toFixed(1) + '" r="3.5" fill="#fff" stroke="' + COL[a.hand] + '" stroke-width="2"/>');
    }
    out.push('<g id="balls"></g>');
    el.innerHTML = out.join('');
    balls();
  }
  function balls() {
    const g = document.getElementById('balls'); if (!g || !V) return;
    const out = [];
    if (V.protos.length || V.strikes.length) {   // every ribbon's ball and every strike's pebbles
      let s = V.strikes.map(pebblesSvg).join('');
      for (const p of V.protos) { const a = p.arc; if (t >= a.t0 && t <= a.t1) s += '<circle cx="' + xOf(t).toFixed(1) + '" cy="' + yPx(gcY(p, t)).toFixed(1) + '" r="' + (ballR(p, t) * S.size).toFixed(1) + '" fill="' + p.look.color + '" stroke="#fff" stroke-width="' + (1.6 * S.size).toFixed(1) + '"/>'; }
      g.innerHTML = s; return;
    }
    if (V.proto) { const p = V.proto, a = p.arc; if (t >= a.t0 && t <= a.t1) out.push('<circle cx="' + xOf(t).toFixed(1) + '" cy="' + yPx(gcY(p, t)).toFixed(1) + '" r="' + (ballR(p, t) * S.size).toFixed(1) + '" fill="' + p.look.color + '" stroke="#fff" stroke-width="' + (1.6 * S.size).toFixed(1) + '"/>'); g.innerHTML = (V.strike ? pebblesSvg() : '') + out.join(''); return; }
    for (const a of M.arcs || []) { if (t < a.t0 || t > a.t1) continue; const y = arcY(a, t); if (y != null) out.push('<circle cx="' + xOf(t).toFixed(1) + '" cy="' + yPx(y).toFixed(1) + '" r="6" fill="' + COL[a.hand] + '"/>'); }
    g.innerHTML = out.join('');
  }
  function place() {
    balls();
    const put = (el, s) => { const x = xOf(s), on = V && s >= V.window[0] - 1e-6 && s <= V.window[1] + 1e-6; el.style.display = on ? 'block' : 'none'; el.style.left = x + 'px'; };
    put($('cursor'), t); put($('la'), S.a); put($('lb'), S.b);
    const sh = $('shade');
    if (V && S.b > S.a) { const x0 = Math.max(xOf(S.a), xOf(V.window[0])), x1 = Math.min(xOf(S.b), xOf(V.window[1])); sh.style.display = x1 > x0 ? 'block' : 'none'; sh.style.left = x0 + 'px'; sh.style.width = (x1 - x0) + 'px'; } else sh.style.display = 'none';
    $('tNow').textContent = fmt(t);
  }

  // ---- the controls
  function show() {
    $('page').value = S.page; $('t0').value = +S.t0.toFixed(2); $('span').value = S.span; $('spanO').textContent = (+S.span).toFixed(1) + ' s · score pace ' + (1768 * S.span / Math.max(1, stageW() / S.size - 152)).toFixed(1) + ' s/page';   // [§365] the same spacing in the notation score: its page is 1920 wide with 1768 px of music, so its seconds per page = 1768 / (this picture's px per second)
    $('size').value = S.size; $('sizeO').textContent = (+S.size).toFixed(2) + '×'; $('rate').value = S.rate; $('rateO').textContent = Math.round(S.rate * 100) + ' %';
    $('a').value = +S.a.toFixed(2); $('b').value = +S.b.toFixed(2); $('loopOn').checked = !!S.loopOn; $('marksOn').checked = !!S.marksOn; $('gap').value = S.gap; $('loops').value = S.loops;
  }
  const num = (id, d) => { const v = parseFloat($(id).value); return Number.isFinite(v) ? v : d; };
  $('page').onchange = () => {
    S.page = $('page').value;
    if (S.page.startsWith('both-')) return fetch('/excerpt?name=both').then(r => r.json()).then(x => { if (x.view) { S.t0 = x.view[0]; S.span = +(x.view[1] - x.view[0]).toFixed(1); S.a = x.arc.t0; S.b = x.arc.t1; } show(); save(); load(); });
    if (S.page.startsWith('chords-')) return fetch('/excerpt?name=chords').then(r => r.json()).then(x => { if (x.view) { S.t0 = x.view[0]; S.span = +(x.view[1] - x.view[0]).toFixed(1); S.a = x.window[0]; S.b = x.window[1]; } show(); save(); load(); });
    if (S.page === 'work') return fetch('/excerpt?name=work').then(r => r.json()).then(x => { if (x.view) { S.t0 = x.view[0]; S.span = +(x.view[1] - x.view[0]).toFixed(1); } show(); save(); load(); });
    if (S.page === 'burst') return fetch('/excerpt?name=burst').then(r => r.json()).then(x => { if (x.view) { S.t0 = x.view[0]; S.span = +(x.view[1] - x.view[0]).toFixed(1); const h = Object.values(x.hands || {}); S.a = Math.min(...h.map(w => w[0])); S.b = Math.max(...h.map(w => w[1])); } show(); save(); load(); });
    if (S.page.startsWith('gravity-proto')) return fetch('/proto').then(r => r.json()).then(p => { S.t0 = p.window[0]; S.span = +(p.window[1] - p.window[0]).toFixed(1); S.a = p.arc.t0; S.b = p.arc.t1; show(); save(); load(); });
    save(); load();
  };
  $('t0').onchange = () => { S.t0 = num('t0', S.t0); save(); load(); };
  $('span').oninput = () => { S.span = num('span', 6); show(); save(); later(); };
  $('size').oninput = () => { S.size = num('size', 2); show(); save(); later(); };
  $('rate').oninput = () => { S.rate = num('rate', 1); audio.playbackRate = S.rate; show(); save(); };
  $('a').onchange = () => { S.a = num('a', S.a); save(); place(); };
  $('b').onchange = () => { S.b = num('b', S.b); save(); place(); };
  $('gap').onchange = () => { S.gap = Math.max(0, num('gap', 2)); save(); };
  $('loops').onchange = () => { S.loops = Math.max(1, Math.round(num('loops', 1))); save(); };
  $('loopOn').onchange = () => { S.loopOn = $('loopOn').checked; save(); };
  $('sub').onchange = () => { S.sub = $('sub').value; save(); load(); };
  $('dens').onchange = () => { S.dens = Math.max(3, Math.min(400, Math.round(num('dens', 16)))); save(); load(); };
  $('marksOn').onchange = () => { S.marksOn = $('marksOn').checked; save(); drawMarks(); };
  const pan = d => { S.t0 = Math.max(INFO.a0, +(S.t0 + d * S.span / 4).toFixed(2)); show(); save(); load(); };
  $('back').onclick = () => pan(-1); $('fwd').onclick = () => pan(1);
  $('fit').onclick = () => { if (!(S.b > S.a)) return; const len = S.b - S.a; S.t0 = +(S.a - Math.max(0.15, len * 0.04)).toFixed(2); S.span = Math.min(24, Math.max(1, +(len * 1.1 + 0.3).toFixed(1))); show(); save(); load(); };

  // ---- the stage: DRAG = select a phrase · click = cursor · SHIFT+click = phrase start · ALT+click = phrase end
  let drag = null;
  const xIn = e => e.clientX - $('stage').getBoundingClientRect().left;
  $('stage').addEventListener('mousedown', e => { if (e.button === 0 && !e.shiftKey && !e.altKey) drag = { x: xIn(e), on: false }; });
  window.addEventListener('mousemove', e => {
    const x = xIn(e);
    if (drag) {
      if (!drag.on && Math.abs(x - drag.x) > 5) drag.on = true;
      if (drag.on) { const p = +tOf(Math.min(drag.x, x)).toFixed(2), q = +tOf(Math.max(drag.x, x)).toFixed(2); S.a = p; S.b = q; show(); place(); }
    }
  });
  window.addEventListener('mouseup', e => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.on) { save(); seek(S.a); } else { seek(+tOf(d.x).toFixed(2)); }
    show(); place();
  });
  $('stage').addEventListener('mousemove', e => { const x = xIn(e); $('hover').style.display = 'block'; $('hover').style.left = x + 'px'; $('tHover').textContent = fmt(tOf(x)); });
  $('stage').addEventListener('mouseleave', () => { $('hover').style.display = 'none'; $('tHover').textContent = '–'; });
  $('stage').addEventListener('click', e => {
    if (!e.shiftKey && !e.altKey) return;
    const s = +tOf(xIn(e)).toFixed(2);
    if (e.shiftKey) S.a = s; else S.b = s;
    show(); save(); place();
  });

  // ---- the sound
  function seek(s) { t = Math.min(INFO.a1 - 0.05, Math.max(INFO.a0, s)); audio.currentTime = t - INFO.a0; waitUntil = 0; place(); }
  function start() {
    if (S.loopOn && S.b > S.a && (t < S.a - 0.01 || t >= S.b - 0.01)) seek(S.a);
    audio.playbackRate = S.rate; playing = true; waitUntil = 0;
    audio.play().catch(() => { playing = false; msg('The sound could not start. Click the page once, then play.'); btn(); });
    btn(); requestAnimationFrame(tick);
  }
  function halt() { playing = false; waitUntil = 0; audio.pause(); btn(); }
  const btn = () => { $('play').textContent = playing ? '❚❚ Pause' : '▶ Play'; };
  function tick() {
    if (!playing) return;
    if (waitUntil) {                                     // the gap between two passes of the loop
      if (performance.now() >= waitUntil) { waitUntil = 0; seek(S.a); audio.play(); }
    } else {
      t = audio.currentTime + INFO.a0;
      if (S.loopOn && S.b > S.a && t >= S.b) { audio.pause(); t = S.b; waitUntil = performance.now() + S.gap * 1000 + 1; }
      else if (audio.ended || t >= INFO.a1 - 0.06) { halt(); }
      // THE PAGE TURNS when the cursor passes the right edge — asked for ONCE: before (§312) every frame asked again while the first answer
      // was on its way, each new asking threw the last answer away, and the page never turned
      else if (V && t > V.window[1] && !turning && !(S.loopOn && S.b > S.a)) { turning = true; setTimeout(() => { turning = false; }, 3000); S.t0 = +V.window[1].toFixed(2); show(); save(); load(); }
    }
    place(); requestAnimationFrame(tick);
  }
  $('play').onclick = () => playing ? halt() : start();
  $('stop').onclick = () => { halt(); seek(S.b > S.a ? S.a : S.t0); };
  document.addEventListener('keydown', e => {
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
    if (e.code === 'Space') { e.preventDefault(); playing ? halt() : start(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); pan(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); pan(1); }
  });

  // ---- the video
  $('clip').onclick = () => {
    if (!V) return;
    if (!(S.b > S.a)) { msg('Select a phrase first.'); return; }
    if (S.a < V.window[0] - 1e-6 || S.b > V.window[1] + 1e-6) { msg('The phrase must be whole on the page: press Fit phrase.'); return; }
    msg('Making the video…'); $('clip').disabled = true;
    fetch('/clip', { method: 'POST', body: JSON.stringify({ page: S.page, t0: V.window[0], span: V.window[1] - V.window[0], w: V.w, k: S.size, a: S.a, b: S.b, rate: S.rate, loops: S.loops, gap: S.loops > 1 ? S.gap : 0 }) })
      .then(r => r.json()).then(r => { $('clip').disabled = false; msg(r.error ? 'The video failed: ' + r.error : 'Video made, ' + r.seconds + ' s: <a href="' + r.url + '" target="_blank">open</a> · or say "send the clip"'); })
      .catch(() => { $('clip').disabled = false; msg('The video failed: the server does not answer.'); });
  };

  window.addEventListener('resize', later);
  if (window.ResizeObserver) { let w0 = 0; new ResizeObserver(() => { const w = $('stage').clientWidth; if (w && Math.abs(w - w0) > 2) { w0 = w; later(); } }).observe($('stage')); }
  fetch('/info').then(r => r.json()).then(i => { INFO = i; if (!i.audio) msg('No sound file was found.'); }).catch(() => {}).then(() => { show(); seek(Math.max(S.t0, Math.min(S.a, S.t0 + S.span))); load(); });
})();
</script>
</body>
</html>

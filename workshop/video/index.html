// ------------------------------------------------------------------ a tumbleweed: a sphere's triangles, its points scattered (ofApp: verts = ctr + random(-rad, rad))
function sphereEdges(res) {
  const g = new THREE.SphereGeometry(1, res, Math.max(3, Math.round(res * 0.75)));
  const idx = g.index.array, n = g.attributes.position.count, seen = new Set(), pairs = [];
  for (let i = 0; i < idx.length; i += 3) for (const [a, b] of [[idx[i], idx[i + 1]], [idx[i + 1], idx[i + 2]], [idx[i + 2], idx[i]]]) {
    const k = a < b ? a * 65536 + b : b * 65536 + a; if (!seen.has(k)) { seen.add(k); pairs.push(a, b); }
  }
  g.dispose(); return { n, pairs };
}

      // [§520] the quiver of §519 (a drawn standing wave) is gone — his "stiff … almost like it's wire"; the crank above moves the rope now
      // [§529] the chain's wave on top, faded toward this rope's own pinned ends (the pulse leaves one rope and appears on the next)
      let cy = 0, cz = 0; if (soloK > 0 && r.off != null && uy) { const e = ((1 - S.freeEnds) * Math.min(1, 3 * Math.sin(Math.PI * j / (r.n - 1))) + S.freeEnds) * soloK; const ix = r.off + j * WK; cy = calm(waveAt(uy, uyo, ix, al)) * e; cz = calm(waveAt(uz, uzo, ix, al)) * e; }   // [§561] the wave between its last two steps, as the ropes are (a frame takes 1, 2 or 3 steps: unsmoothed, it advanced in uneven jumps)   // [§530] ends free: the pulse passes through them
      const w = r.weeds[j], x = r.q[3 * j] + (r.p[3 * j] - r.q[3 * j]) * al, y = r.q[3 * j + 1] + (r.p[3 * j + 1] - r.q[3 * j + 1]) * al + cy, z = r.q[3 * j + 2] + (r.p[3 * j + 2] - r.q[3 * j + 2]) * al + cz;
      let bx = x, by = y, bz = z;
      if (r.pl && r.pl.kind === 'ensemble') {                                // [§558 — his "lighten the instrument ropes"] smaller and dimmer in the counterpoint
        w.mesh.scale.setScalar(1 - S.ensSmall * stateK); w.mesh.material.opacity = S.opacity * r.ch.op * (1 - S.ensDim * stateK);
      }
      if (r.dense && r.grainOn && S.growMode && !S.singleBead) {             // [§548] in the state the rope's own tumbleweeds give way to the dense beads
        w.mesh.visible = false; lp[3 * j] = x; lp[3 * j + 1] = y; lp[3 * j + 2] = z; continue;
      }
      if (false) {                                                           // (§545's grow branch on the rope's own tumbleweeds — replaced by the dense set, §548)
        // [§545 — his "turn that motion into longitudinal motion … the pulse will be the beads or the nodes growing. They'll be static … they'll
        // need to start pretty small"] THE BEADS STAY PUT (each at its own slightly uneven place on the rope); THE PLACE THE SOUND IS (the bead of
        // §542, followed as before) becomes a swelling: the beads near it grow quickly to growBig, and shrink back slowly to growSmall behind it
        const uj = Math.max(0, Math.min(r.n - 1, j + r.jit[j])), a = Math.min(r.n - 2, Math.floor(uj)), f = uj - a;
        bx = r.p[3 * a] + (r.p[3 * a + 3] - r.p[3 * a]) * f; by = r.p[3 * a + 1] + (r.p[3 * a + 4] - r.p[3 * a + 1]) * f; bz = r.p[3 * a + 2] + (r.p[3 * a + 5] - r.p[3 * a + 2]) * f;
        const bell = Math.exp(-((uj / (r.n - 1) - r.beadU) ** 2) / (2 * S.growWidth ** 2)), tgt = S.growSmall + (S.growBig - S.growSmall) * bell;
        if (w.gr == null) w.gr = S.growSmall;
        w.gr += (tgt - w.gr) * Math.min(1, dt / (tgt > w.gr ? S.growAttack : S.growRelease));
        if (!w.mesh.visible && r.line.visible) w.mesh.visible = true;
        w.mesh.scale.setScalar(w.gr); w.mesh.position.set(bx, by, bz); lp[3 * j] = x; lp[3 * j + 1] = y; lp[3 * j + 2] = z;
        w.gS = 1;                                                          // the §538 size eases back to normal when the bed ends
      } else if (S.singleBead && r.grainOn && r.beadU != null) {
        const jb = Math.floor(r.n / 2); w.mesh.visible = j === jb && r.line.visible;
        if (j === jb) {
          const u = r.beadU * (r.n - 1), a = Math.min(r.n - 2, Math.floor(u)), f = u - a;
          bx = r.p[3 * a] + (r.p[3 * a + 3] - r.p[3 * a]) * f; by = r.p[3 * a + 1] + (r.p[3 * a + 4] - r.p[3 * a + 1]) * f; bz = r.p[3 * a + 2] + (r.p[3 * a + 5] - r.p[3 * a + 2]) * f;
          w.mesh.scale.setScalar(S.beadSize); w.mesh.rotation.z = r.beadV * 0.6;
        }
        w.mesh.position.set(bx, by, bz); lp[3 * j] = x; lp[3 * j + 1] = y; lp[3 * j + 2] = z;
        continue;
      } else if (r.line.visible && !w.mesh.visible) w.mesh.visible = true;
      if (S.growMode && !S.singleBead && r.grainOn && r.beadU != null) { /* §545 drawn above */ } else if (r.lwE || r.grainOn) {   // [§541] the bead slides ON the rope
        const u = Math.max(0, Math.min(r.n - 1, j + r.lw[j] / (W / (r.n - 1)))), a = Math.floor(u), b2 = Math.min(r.n - 1, a + 1), f = u - a;
        bx = r.p[3 * a] + (r.p[3 * b2] - r.p[3 * a]) * f; by = r.p[3 * a + 1] + (r.p[3 * b2 + 1] - r.p[3 * a + 1]) * f + cy; bz = r.p[3 * a + 2] + (r.p[3 * b2 + 2] - r.p[3 * a + 2]) * f + cz;
        const v = r.lwo[j], sh = r.cen == null ? 0 : Math.exp(-((j / (r.n - 1) - (r.cen + 1) / 2) ** 2) / (2 * S.showerWidth ** 2));
        w.mesh.rotation.z = v * S.pivot * 0.05;                              // it tips as it slides
        const stir = Math.min(0.6, Math.abs(v) * S.tumble * 0.01 + sh * S.showerStir); w.mesh.rotation.x += stir; w.mesh.rotation.y += stir * 0.7;
      }
      if (!(S.growMode && !S.singleBead && r.grainOn && r.beadU != null)) w.mesh.position.set(bx, by, bz), lp[3 * j] = x, lp[3 * j + 1] = y, lp[3 * j + 2] = z;
      if (!(S.growMode && !S.singleBead && r.grainOn && r.beadU != null) && (r.grainOn || w.gS != null)) {                                       // [§538] the grain rope's tumbleweeds: inflate on grains, deflate between
        if (r.grainOn) w.gT = Math.max(S.gMin, (w.gT ?? S.gMin) - S.gFall * dt); else w.gT = 1;
        if (w.gS == null || !isFinite(w.gS)) w.gS = 1;                     // [§539] a size starts at its normal 1 (undefined made it NaN: the tumbleweeds vanished)
        w.gS += (w.gT - w.gS) * Math.min(1, dt / S.gEase);
        w.mesh.scale.setScalar(w.gS);
        const full = Math.max(0, Math.min(1, (w.gS - S.gMin) / Math.max(0.01, S.gMax - S.gMin)));
        w.mesh.material.opacity = Math.min(1, S.opacity * r.ch.op * (1 + S.grainGlow * full));
        if (!r.grainOn && Math.abs(w.gS - 1) < 0.005) { w.gS = null; w.gT = null; w.mesh.scale.setScalar(1); w.mesh.material.opacity = S.opacity * r.ch.op; }
      }
      if (w.to) {
        w.k = Math.min(1, w.k + 1 / Math.max(1, S.morph * r.ch.morph * (r.grainOn ? S.grainMorph : 1))); const e = w.k * w.k * (3 - 2 * w.k);
        for (let m = 0; m < w.pos.length; m++) w.pos[m] = w.from[m] + (w.to[m] - w.from[m]) * e;
        w.mesh.geometry.attributes.position.needsUpdate = true; if (w.k >= 1) w.to = w.from = null;
      }
    }
    r.line.geometry.attributes.position.needsUpdate = true;
    if (r.dense) {                                                           // [§548] the dense beads: each at its place along the rope, growing where the sound is
      const on = !!(r.grainOn && S.growMode && !S.singleBead && r.line.visible && r.beadU != null);
      for (const d of r.dense) {
        d.mesh.visible = on; if (!on) { d.gr = null; continue; }
        const uj = d.u * (r.n - 1), a = Math.min(r.n - 2, Math.floor(uj)), f = uj - a;
        d.mesh.position.set(lp[3 * a] + (lp[3 * a + 3] - lp[3 * a]) * f, lp[3 * a + 1] + (lp[3 * a + 4] - lp[3 * a + 1]) * f, lp[3 * a + 2] + (lp[3 * a + 5] - lp[3 * a + 2]) * f);
        const bell = Math.exp(-((d.u - r.beadU) ** 2) / (2 * S.growWidth ** 2)), tgt = S.growSmall + (S.growBig - S.growSmall) * bell;
        if (d.gr == null) d.gr = S.growSmall;
        d.gr += (tgt - d.gr) * Math.min(1, dt / (tgt > d.gr ? S.growAttack : S.growRelease));
        d.mesh.scale.setScalar(d.gr);
      }
      if (!on) for (const w of r.weeds) if (r.line.visible && !w.mesh.visible && !(S.singleBead && r.grainOn)) w.mesh.visible = true;
    }
    // [§550 — his "no interconnected line. Like I still see a continuous rope"] in the new state the rope's own line is hidden (a knob brings it back)
    if (r.dense) r.line.material.opacity = (r.grainOn && !S.spineInState) ? 0 : S.spine;
    if (r.shadow) {
      const on = !!(S.shadow && r.grainOn && r.line.visible); r.shadow.visible = on;
      if (on) {
        const pts = r.shPts || (r.shPts = new Float32Array(3 * r.n));
        for (let j = 0; j < r.n; j++) { pts[3 * j] = lp[3 * j]; const sm = Math.max(1, S.shadowMax); const twj = r.two[j] + (r.tw[j] - r.two[j]) * al, tzj = r.tzo[j] + (r.tz[j] - r.tzo[j]) * al; pts[3 * j + 1] = lp[3 * j + 1] + sm * Math.tanh(twj / sm); pts[3 * j + 2] = lp[3 * j + 2] + S.shadowZ + sm * Math.tanh(tzj / sm); }   // [§561] between its last two steps   // [§551] a soft limit: the motion keeps its shape, only its farthest swings are held in
        r.shadow.geometry.setPositions(pts); r.shadow.material.linewidth = S.shadowWidth; r.shadow.material.opacity = S.shadowOp;
      }
      const B = r.shadow.balls, bon = on && !!S.shadowBalls; B.visible = bon; if (bon) r.shadow.visible = false;
      if (bon) {                                                             // [§549] the balls at even places along the shadow (between its points)
        const bp = B.geometry.attributes.position.array, NB = bp.length / 3, pts = r.shPts;
        for (let k = 0; k < NB; k++) {
          const u = k / (NB - 1) * (r.n - 1), a = Math.min(r.n - 2, Math.floor(u)), f = u - a;
          for (let c = 0; c < 3; c++) bp[3 * k + c] = pts[3 * a + c] + (pts[3 * a + 3 + c] - pts[3 * a + c]) * f;
        }
        B.geometry.attributes.position.needsUpdate = true; B.material.size = S.shadowWidth; B.material.opacity = S.shadowOp;
        // the satellites: each ball's speed (from the shadow's own waves, now against a moment ago) spins them and flings them out; they fly
        // out quickly and come back in slowly; they whirl round the rope's line (in the up-down / toward-away plane)
        const Sa = r.shadow.sats, ns = Math.max(0, Math.round(S.satCount)), sp = Sa.geometry.attributes.position.array, sh = r.shadow;
        Sa.visible = ns > 0; if (ns > 0) {
          for (let k = 0; k < NB; k++) {
            const u = k / (NB - 1) * (r.n - 1), a = Math.min(r.n - 2, Math.floor(u)), f = u - a;
            const vy = ((r.tw[a] - r.two[a]) * (1 - f) + (r.tw[a + 1] - r.two[a + 1]) * f) / STEP, vz = ((r.tz[a] - r.tzo[a]) * (1 - f) + (r.tz[a + 1] - r.tzo[a + 1]) * f) / STEP;
            const spd = Math.min(2, Math.hypot(vy, vz) / S.satSpeed), want = S.satReach * Math.min(1, spd);
            sh.rho[k] += (want - sh.rho[k]) * Math.min(1, dt / (want > sh.rho[k] ? S.satOut : S.satIn));
            sh.th[k] += 2 * Math.PI * S.satSpin * spd * dt;
            for (let s = 0; s < ns; s++) {
              const ang = sh.th[k] + sh.ph[k] + s * 2 * Math.PI / ns, o = 3 * (k * ns + s);
              sp[o] = bp[3 * k]; sp[o + 1] = bp[3 * k + 1] + sh.rho[k] * Math.cos(ang); sp[o + 2] = bp[3 * k + 2] + sh.rho[k] * Math.sin(ang);
            }
          }
          Sa.geometry.attributes.position.needsUpdate = true; Sa.material.size = S.satSize; Sa.material.opacity = S.shadowOp;
        }
      } else if (r.shadow.sats) r.shadow.sats.visible = false;
    }
  }
  bloom.strength = S.bloom; bloom.radius = S.radius; bloom.threshold = S.thresh;
  // [§524 — his "the center is perhaps a little too high … a way to get it pretty centered"] THE FRAME FOLLOWS THE ROPES: the middle of
  // their highest and lowest points, eased slowly, the view moved by the difference (a turned view stays turned)
  let lo = Infinity, hi = -Infinity; for (const r of ropes) if (r.line.visible) for (let j = 0; j < r.n; j += 2) { const y = r.p[3 * j + 1]; if (y < lo) lo = y; if (y > hi) hi = y; }
  if (isFinite(lo)) { const want = (lo + hi) / 2 + S.frameY, dy = (want - controls.target.y) * Math.min(1, dt * 0.6); controls.target.y += dy; camera.position.y += dy; }
  controls.update(); composer.render();
  const t = audio.currentTime; timeEl.textContent = fmt(t); if (!scrubbing) scrub.value = t;
  if (frame % 6 === 0) legend.innerHTML = ropes.filter(r => r.pl).map(r => '<div><span style="color:#' + r.line.material.color.getHexString() + '">■</span> ' + (r.pl.kind === 'session' ? 'electronics · ' + PLAYER_NAMES[r.pl.part] : 'ensemble · ' + r.pl.part) + (r.st && r.st.on > 0.05 ? (r.pl.kind === 'session' ? ' · tremolo ' + r.st.sp.toFixed(1) + ' Hz' : ' · busy ' + Math.round((r.st.sp - 2) / 18 * 100) + '%') + (r.pl.kind === 'ensemble' ? ' · shaking ' + r.sf.toFixed(2) + ' a second' : ' · turning ' + r.w.toFixed(2) + ' a second') : ' · silent') + '</div>').join('');
  requestAnimationFrame(tick);
}

// ------------------------------------------------------------------ the knobs panel
const panel = document.getElementById('panel');
const REBUILD = new Set([ 'satCount', 'ballCount', 'beadJitter', 'ropes', 'nodes', 'spreadY', 'spreadZ', 'slack', 'ropeSlack', 'ensSlack', 'seed', 'res', 'palette', 'taper', 'sizeL', 'sizeH']);
function knobsHtml() {
  let h = '<h2>Palette</h2><select id="k-palette">' + Object.keys(PALETTES).map(k => '<option value="' + k + '"' + (k === S.palette ? ' selected' : '') + '>' + PALETTE_NAMES[k] + '</option>').join('') + '</select>';
  for (const [title, rows] of KNOBS) {
    h += '<h2>' + title + '</h2>';
    for (const [k, label, a, b, st] of rows) h += '<div class="row"><label for="k-' + k + '">' + label + '</label><input id="k-' + k + '" type="range" min="' + a + '" max="' + b + '" step="' + st + '" value="' + S[k] + '"><output id="o-' + k + '">' + S[k] + '</output></div>';
  }
  h += '<button id="save">Save this look</button><div id="msg"></div><p class="hint">Drag on the picture to turn the view · scroll to zoom · double-click to go back to the front view.</p>';
  return h;
}
panel.innerHTML = knobsHtml();
panel.addEventListener('input', e => {
  const id = e.target.id.replace(/^k-/, ''); if (!(id in S)) return;
  S[id] = id === 'palette' ? e.target.value : +e.target.value;
  const o = document.getElementById('o-' + id); if (o) o.textContent = S[id];
  if (id === 'opacity') ropes.forEach(r => r.weeds.forEach(w => w.mesh.material.opacity = S.opacity * r.ch.op));
  if (id === 'spine') ropes.forEach(r => r.line.material.opacity = S.spine);
  if (REBUILD.has(id)) { build(); applyShow(); buildChain(); dealCentres(); }
  if (['fSpread', 'fRadLo', 'fRadHi', 'fShort', 'fLong'].includes(id)) dealCentres();
  if (id === 'frameY') homeCamera();
  if (id === 'oneRope') applyShow();
});
panel.addEventListener('click', async e => {
  if (e.target.id !== 'save') return;
  const r = await fetch('/settings', { method: 'POST', body: JSON.stringify(S) });
  document.getElementById('msg').textContent = r.ok ? 'Saved.' : 'Not saved.';
});
document.getElementById('toggle').onclick = () => { panel.classList.toggle('hidden'); resize(); };
document.getElementById('labels').onclick = () => document.getElementById('legend').classList.toggle('hidden');
renderer.domElement.addEventListener('dblclick', homeCamera);

// ------------------------------------------------------------------ the audio and the time
const legend = document.getElementById('legend'), audio = document.getElementById('audio'), playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
const fmt = t => Math.floor(t / 60) + ':' + (t % 60).toFixed(1).padStart(4, '0');
let scrubbing = false;
playBtn.onclick = () => { if (audio.paused) audio.play(); else audio.pause(); };
audio.onplay = () => playBtn.textContent = 'Pause'; audio.onpause = () => playBtn.textContent = 'Play';
audio.onloadedmetadata = () => scrub.max = audio.duration.toFixed(1);
scrub.oninput = () => { scrubbing = true; timeEl.textContent = fmt(+scrub.value); };
scrub.onchange = () => { audio.currentTime = +scrub.value; scrubbing = false; };
// [§525 — his "can we just turn off the tremolo ones for now? … so I can just see the instruments"] show or hide each family of ropes
S.showElec = S.showElec ?? 0; S.showEns = S.showEns ?? 1;      // [§564 — his "let's see just the instrumental ones"]      // [§557 — his "let's see all the ropes together now"]      // [§528 — his "Let's see all the ropes now, please."] (§527 showed the tremolo ones alone)
function applyShow() {
  // [§537 — his "can you take all the other ropes out or just hide them?"] ONLY THE GRAIN ROPE: every other rope hidden (they still move)
  const grainRope = ropes[LANE_ROPE[2]];
  const oneRope = ropes.find(r => r.pl && r.pl.kind === 'ensemble' && r.pl.part === 'flute');   // [§565 — his "let's just do one row"]
  for (const r of ropes) { const on = S.oneRope ? r === oneRope : S.onlyGrain ? r === grainRope : !r.pl ? true : r.pl.kind === 'session' ? !!S.showElec : !!S.showEns; r.weeds.forEach(w => w.mesh.visible = on); r.line.visible = on; }
  document.getElementById('onlyGrain').textContent = 'Grain rope only: ' + (S.onlyGrain ? 'on' : 'off');
  document.getElementById('showElec').textContent = 'Electronics: ' + (S.showElec ? 'on' : 'off');
  document.getElementById('showEns').textContent = 'Ensemble: ' + (S.showEns ? 'on' : 'off');
}
document.getElementById('showElec').onclick = () => { S.showElec = S.showElec ? 0 : 1; applyShow(); };
document.getElementById('showEns').onclick = () => { S.showEns = S.showEns ? 0 : 1; applyShow(); };
S.onlyGrain = S.onlyGrain ?? 0;
document.getElementById('onlyGrain').onclick = () => { S.onlyGrain = S.onlyGrain ? 0 : 1; applyShow(); };
document.getElementById('kick').onclick = () => ropes.forEach(r => kick(r, R(live, 3, r.n - 4), S.kick * 1.5));
window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); playBtn.click(); } });

resize(); build(); applyShow(); buildChain(); dealCentres(); requestAnimationFrame(tick);
window.__V = { get ropes() { return ropes; }, camera, S, get uy() { return uy; }, get soloK() { return soloK; }, hand: t => hand(t) };   // for inspection only
</script>

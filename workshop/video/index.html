<title>Video Workshop — Multiplicity</title>
<!-- THE VIDEO WORKSHOP, step 1 (the Switch~ piece SW-168, RUNNING_LOG §517): double Dutch's look in the browser — the ropes, the tumbleweeds,
     the bloom, the painters' palettes — with the demo recording and a time slider. Served by tools/video_workshop.js on 5660.
     The rope is its own (Verlet, fixed step), not Bullet: the same input gives the same motion, so the video can be rendered offline later. -->
<style>
  :root { --ink: #ddd; --dim: #888; --panel: rgba(18,18,20,0.92); --line: #333; --accent: #e0b200; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); }
  #bar button { background: #222; color: var(--ink); border: 1px solid #444; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  #bar button:hover { border-color: var(--accent); }
  #time { width: 110px; font-variant-numeric: tabular-nums; }
  #scrub { flex: 1; }
  #panel { position: fixed; top: 0; right: 0; bottom: 46px; width: 290px; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 10px 12px; box-sizing: border-box; }
  #panel.hidden { display: none; }
  #legend { position: fixed; left: 12px; top: 10px; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; pointer-events: none; }
  #panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 14px 0 6px; font-weight: 600; }
  #panel h2:first-child { margin-top: 0; }
  .row { display: grid; grid-template-columns: 1fr 70px; gap: 2px 8px; align-items: center; margin: 5px 0; }
  .row label { grid-column: 1 / 3; color: var(--ink); }
  .row input[type=range] { width: 100%; }
  .row output { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  select { width: 100%; background: #222; color: var(--ink); border: 1px solid #444; padding: 3px; }
  #save { margin-top: 12px; width: 100%; background: #2a2a2a; color: var(--ink); border: 1px solid #555; padding: 6px; border-radius: 4px; cursor: pointer; }
  #msg { color: var(--accent); min-height: 1.3em; margin-top: 6px; }
  .hint { color: var(--dim); font-size: 12px; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ------------------------------------------------------------------ the palettes, double Dutch's own (sketch 006, ofApp.cpp)
const PALETTES = {
  dekooning: [[176,30,7],[196,0,0],[185,103,10],[235,225,136],[21,149,102],[111,166,21],[203,133,28],[224,178,0],[106,150,36]],
  kandinsky: [[49,47,165],[124,145,252],[134,96,200],[119,115,206],[143,108,53],[176,158,92],[29,21,50],[38,11,22],[165,152,208]],
  johns:     [[195,14,22],[10,99,225],[244,197,9],[21,133,78],[245,81,0],[120,51,255],[203,50,39],[0,64,190],[251,206,0]],
  klee:      [[174,42,6],[224,183,54],[44,150,115],[157,122,43],[207,222,195],[204,43,0],[215,157,20],[0,158,95],[198,125,0]],
  white:     Array(9).fill([255,255,255]),
};
const PALETTE_NAMES = { dekooning: 'de Kooning · Seated Woman', kandinsky: 'Kandinsky · yellow-red-blue', johns: 'Jasper Johns · Target', klee: 'Klee · Southern Tunisian Gardens', white: 'white' };

// ------------------------------------------------------------------ the knobs (defaults = sketch 006's numbers where it had them)
const KNOBS = [
  ['Ropes', [
    ['ropes', 'Number of ropes', 1, 11, 1, 11],
    ['nodes', 'Points per rope', 8, 60, 1, 27],
    ['spreadY', 'Height spread', 0, 400, 5, 170],
    ['spreadZ', 'Depth spread', 0, 400, 5, 150],
    ['slack', 'Slack (1 = taut)', 1, 1.3, 0.005, 1.04],
    ['seed', 'Layout seed', 1, 99, 1, 7],
    ['frameY', 'Frame: nudge lower (−) or higher (+) — the frame follows the ropes', -300, 300, 5, 0],
  ]],
  ['Tumbleweeds', [
    ['sizeL', 'Size, smallest', 1, 60, 1, 5],
    ['sizeH', 'Size, largest', 1, 120, 1, 50],
    ['res', 'Detail (sphere resolution)', 3, 16, 1, 8],
    ['scrL', 'Re-scramble, soonest (frames)', 5, 400, 1, 90],
    ['scrH', 'Re-scramble, latest (frames)', 5, 800, 1, 300],
    ['morph', 'Re-scramble glide (frames)', 1, 120, 1, 40],
    ['taper', 'Smaller toward the ends', 0, 1, 0.01, 0.8],
    ['spine', 'Rope line', 0, 1, 0.01, 0.3],
    ['opacity', 'Line opacity', 0.05, 1, 0.01, 0.75],
  ]],
  ['Glow', [
    ['bloom', 'Bloom strength', 0, 3, 0.01, 0.5],
    ['radius', 'Bloom radius', 0, 1.5, 0.01, 0.25],
    ['thresh', 'Bloom threshold', 0, 1, 0.01, 0.35],
  ]],
  ['Motion', [
    ['gravity', 'Gravity', 0, 2000, 10, 500],
    ['damping', 'Damping', 0.9, 1, 0.001, 0.985],
    ['breeze', 'Breeze at rest', 0, 200, 1, 40],
    ['breezeHz', 'Breeze speed (cycles a second)', 0.02, 1, 0.01, 0.12],
    ['collective', 'The air the moving ropes stir (all ropes feel it)', 0, 400, 1, 90],
    ['kick', 'Kick strength', 0, 3000, 10, 900],
    ['kickRate', 'Random kicks per rope per second', 0, 4, 0.05, 0],
    ['kickWidth', 'Kick width (points)', 0.5, 12, 0.5, 4],
  ]],
  ['Tremolo — ropes 1 … 4 are the session’s four players, ropes 5 … 9 the ensemble (the data sets these; the knobs set only the scale)', [
    ['turnMin', 'Slowest turn (turns a second)', 0, 2, 0.05, 0.35],
    ['turnMax', 'Fastest turn (turns a second)', 0.5, 5, 0.05, 2.4],
    ['crankR', 'Crank size', 0, 120, 1, 38],
    ['ropeSlack', 'Jump-rope slack (at rest)', 1, 1.4, 0.005, 1.1],
    ['pull', 'Tension: how far the ends pull apart at full speed', 0, 200, 1, 70],
    ['inertia', 'How quickly the turning follows the tremolo', 0.1, 6, 0.05, 1.2],
    ['ropeAir', 'Jump-rope air (1 = none)', 0.97, 1, 0.001, 0.996],
    ['accentPush', 'Accent push (extra turns a second)', 0, 3, 0.05, 0.8],
    ['accentKick', 'Accent kick', 0, 3000, 10, 250],
    ['ensPush', 'Ensemble accents: share of the push', 0, 1, 0.01, 0.3],
  ]],
  ['Ensemble ropes 5 … 9 — shaken from one end, waves running along a tauter rope', [
    ['shakeMin', 'Slowest shake (a second)', 0.1, 3, 0.05, 0.35],
    ['shakeMax', 'Fastest shake (a second)', 0.5, 8, 0.1, 4.2],
    ['shakeAmp', 'Shake size', 0, 250, 1, 85],
    ['ensSlack', 'Ensemble rope slack', 1, 1.2, 0.005, 1.035],
    ['ensPull', 'Tension: far end pulls away at full speed', 0, 150, 1, 45],
    ['snap', 'Accent: a snap (extra size for a moment)', 0, 3, 0.05, 1.3],
    ['ensInertia', 'How quickly the shaking follows the music', 0.1, 6, 0.05, 3],
    ['roomDepth', 'Place in the room → depth', 0, 800, 10, 300],
    ['agitate', 'Busy player → tumbleweeds stir', 0, 1, 0.01, 0.7],
  ]],
];
const S = {}; KNOBS.forEach(([, rows]) => rows.forEach(r => S[r[0]] = r[5]));
S.palette = 'dekooning';
try { Object.assign(S, await (await fetch('/settings')).json()); } catch (e) {}
// [§519] THE DATA (tools/video_data.js): per player, at D.rate a second of score time — on · speed · depth · hardness · azimuth · accents
let D = null; try { D = await (await fetch('/data')).json(); } catch (e) {}
const PLAYER_NAMES = { archtop: 'archtop', 'baritone-guitar': 'baritone guitar', drums: 'drums', piano: 'piano' };
// [§521] ropes 1 … 4 the session's players (the electronics' tremolo), ropes 5 … 9 the ensemble in five groups (the score's notes)
const sourceOf = i => !D ? null : i < 4 ? (D.players[i] ? { ...D.players[i], kind: 'session' } : null) : (D.groups && D.groups[i - 4] ? { ...D.groups[i - 4], kind: 'ensemble' } : null);
const at = (arr, t) => { const x = t * D.rate, i = Math.floor(x); if (i < 0) return arr[0]; if (i >= arr.length - 1) return arr[arr.length - 1]; return arr[i] + (arr[i + 1] - arr[i]) * (x - i); };

// ------------------------------------------------------------------ a seeded random (the layout repeats; the motion is the input's)
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = (rand, a, b) => a + (b - a) * rand();

// ------------------------------------------------------------------ the scene
const W = 1600, H = 900;                                // the world's frame: 16:9, the ropes run from -W/2 to W/2
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
document.getElementById('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(50, 16 / 9, 1, 10000);
const controls = new OrbitControls(camera, renderer.domElement);
// [§521 — his "center it better so the lowest one doesn't hang down below the bottom, and there's not as much black space on the top"]
function homeCamera() { const z = (W / 2) / Math.tan(THREE.MathUtils.degToRad(50) / 2) / (16 / 9) * 1.02, y = controls.target ? controls.target.y : 0; camera.position.set(0, y, z); controls.target.set(0, y, 0); controls.update(); }
homeCamera();
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), S.bloom, S.radius, S.thresh);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize() {
  const w = window.innerWidth, h = window.innerHeight - 46;
  renderer.setSize(w, h); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.domElement.style.height = h + 'px';
}
window.addEventListener('resize', resize);

// ------------------------------------------------------------------ a tumbleweed: a sphere's triangles, its points scattered (ofApp: verts = ctr + random(-rad, rad))
function sphereEdges(res) {
  const g = new THREE.SphereGeometry(1, res, Math.max(3, Math.round(res * 0.75)));
  const idx = g.index.array, n = g.attributes.position.count, seen = new Set(), pairs = [];
  for (let i = 0; i < idx.length; i += 3) for (const [a, b] of [[idx[i], idx[i + 1]], [idx[i + 1], idx[i + 2]], [idx[i + 2], idx[i]]]) {
    const k = a < b ? a * 65536 + b : b * 65536 + a; if (!seen.has(k)) { seen.add(k); pairs.push(a, b); }
  }
  g.dispose(); return { n, pairs };
}
// [his "big polygons come out of the attachment points"] a tumbleweed's size: random in the knobs' range, smaller toward the pinned ends
// (taper 1 = nothing at the ends), and never wider than the gap to its neighbours
// [§525 — his "change something about each instrument's rope's behavior a little bit … blinking speed … type of motion … number of nodes
// … smoothness … amplitude … each … a different kind of feel … subtle"] THE CHARACTERS of the ensemble's five ropes, as multipliers of the
// shared knobs (1 = as the knobs say). The AI's first reading of each instrument, his to change:
//   flute · clarinet · alto sax   airy: smoother, smaller tumbleweeds, a slow glide, a sway sideways as well as up and down (each its own, §526)
//   percussion crisp: few angular lines, quick re-scrambles that snap rather than glide, the snap dying fast
//   piano      struck: rounder (more detail), the strongest snap, a medium glide
//   violin     fine and quick: more, smaller points, a faster shake of smaller size
//   cello      heavy: fewer, larger points, a slower and wider shake, a long glide
const CHAR = {
  // [§526] the winds now three: flute the airiest and finest · clarinet smooth and round · alto sax warmer, the widest sway
  flute:      { nodes: 1.15, size: 0.7,  res: 0.9,  morph: 2.4, scr: 1.3,  shake: 1.1,  amp: 0.8,  snap: 0.6, snapFade: 2.2, sway: 0.9,  op: 0.8 },
  clarinet:   { nodes: 1,    size: 0.85, res: 1.25, morph: 2,   scr: 1.2,  shake: 1,    amp: 0.9,  snap: 0.7, snapFade: 2,   sway: 0.6,  op: 0.9 },
  'alto sax': { nodes: 0.95, size: 0.95, res: 1.1,  morph: 1.6, scr: 1.1,  shake: 0.95, amp: 1,    snap: 0.8, snapFade: 2,   sway: 1.1,  op: 0.95 },
  percussion: { nodes: 0.85, size: 0.9,  res: 0.6,  morph: 0.12, scr: 0.4, shake: 1.1,  amp: 0.85, snap: 1.2, snapFade: 6,   sway: 0.1,  op: 1 },
  piano:      { nodes: 1,    size: 1,    res: 1.35, morph: 0.6, scr: 0.8,  shake: 1,    amp: 1,    snap: 1.5, snapFade: 3.5, sway: 0.2,  op: 1 },
  violin:     { nodes: 1.3,  size: 0.65, res: 1,    morph: 0.8, scr: 0.7,  shake: 1.3,  amp: 0.7,  snap: 0.9, snapFade: 3,   sway: 0.3,  op: 0.95 },
  cello:      { nodes: 0.75, size: 1.35, res: 1,    morph: 1.8, scr: 1.4,  shake: 0.7,  amp: 1.35, snap: 1,   snapFade: 1.8, sway: 0.35, op: 1 },
};
const PLAIN = { nodes: 1, size: 1, res: 1, morph: 1, scr: 1, shake: 1, amp: 1, snap: 1, snapFade: 2.5, sway: 0.25, op: 1 };
const charOf = src => (src && src.kind === 'ensemble' && CHAR[src.part]) || PLAIN;
const edgeCache = {}; const edgesFor = res => edgeCache[res] || (edgeCache[res] = sphereEdges(res));
function weedRad(j, n, seg, mul = 1) {
  const u = j / (n - 1), env = (1 - S.taper) + S.taper * Math.pow(Math.sin(Math.PI * u), 0.7);
  return Math.min(seg * 0.9, R(live, S.sizeL, Math.max(S.sizeL, S.sizeH)) * env * mul);
}
function scramble(pos, n, rad, rand) { for (let k = 0; k < n; k++) { pos[3 * k] = R(rand, -rad, rad); pos[3 * k + 1] = R(rand, -rad, rad); pos[3 * k + 2] = R(rand, -rad, rad); } }

// ------------------------------------------------------------------ the ropes (Verlet: positions now and before; the ends pinned)
let ropes = [], live = rng(12345);
function build() {
  ropes.forEach(r => { r.weeds.forEach(w => { scene.remove(w.mesh); w.mesh.geometry.dispose(); w.mesh.material.dispose(); }); scene.remove(r.line); r.line.geometry.dispose(); r.line.material.dispose(); });
  ropes = [];
  const lay = rng(S.seed), pal = PALETTES[S.palette] || PALETTES.dekooning;
  for (let i = 0; i < S.ropes; i++) {
    const src0 = sourceOf(i), ch = charOf(src0), y = R(lay, -S.spreadY, S.spreadY), z = R(lay, -S.spreadZ, S.spreadZ), n = Math.max(6, Math.round(S.nodes * ch.nodes));
    const sph = edgesFor(Math.max(3, Math.round(S.res * ch.res)));
    const src = src0, span = W, len = span * (src ? (src.kind === 'ensemble' ? S.ensSlack : S.ropeSlack) : S.slack), seg = len / (n - 1);
    const p = new Float32Array(3 * n), q = new Float32Array(3 * n);
    // start hanging in a shallow arc so the slack is already taken up
    const sag = Math.sqrt(Math.max(0, (len * len - span * span))) * 0.5;
    for (let j = 0; j < n; j++) { const u = j / (n - 1); p[3 * j] = -W / 2 + span * u; p[3 * j + 1] = y - sag * Math.sin(Math.PI * u); p[3 * j + 2] = z; }
    q.set(p);
    const c = pal[i % pal.length], colour = new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255);
    const weeds = [];
    for (let j = 0; j < n; j++) {
      const pos = new Float32Array(3 * sph.n); scramble(pos, sph.n, weedRad(j, n, seg, ch.size), live);
      const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(sph.pairs);
      const mesh = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: colour, transparent: true, opacity: S.opacity * ch.op }));
      scene.add(mesh); weeds.push({ mesh, pos, n: sph.n, from: null, to: null, k: 0 });
    }
    // [his "the polygons don't feel part of the rope"] a faint line through the points, the rope's own colour
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3 * n), 3));
    const line = new THREE.Line(lg, new THREE.LineBasicMaterial({ color: colour, transparent: true, opacity: S.spine })); scene.add(line);
    ropes.push({ ch, pl: src, side: i % 2 ? n - 1 : 0, sf: 0, sfT: 0, sa: 0, saT: 0, sph: 0, snapK: 0, th: R(lay, 0, Math.PI * 2), w: 0, wT: 0, pullC: 0, pullT: 0, zt: z, ze: z, st: null, p, q, n, seg, y, z, weeds, line, ph: R(lay, 0, Math.PI * 2), ph2: R(lay, 0, Math.PI * 2), timer: Math.round(R(live, S.scrL, S.scrH)) });
  }
}

const STEP = 1 / 120, ITER = 24;
let simT = 0, air = 0;
function stepRope(r, dt) {
  const { p, q, n } = r, g = S.gravity * dt * dt, d = r.pl ? S.ropeAir : S.damping;
  // [his "pretty subtle motion at rest"] a breeze: a slow, smooth push that drifts along the rope — two sines, the rope's own phases
  // [§527 — his "a very light breeze from the spinning ropes … something so that that static rope gets pushed just a little bit based on the
  // activity going on amongst all the ropes"] THE STIRRED AIR: the shown ropes' activity (eased, see tick) adds to every rope's breeze, a
  // little quicker and less regular than the breeze itself; a still rope among busy ones stirs, gently
  const w = 2 * Math.PI * S.breezeHz, bz = S.breeze * dt * dt, ga = S.collective * air * dt * dt, wa = w * 2.3;
  for (let j = 1; j < n - 1; j++) {
    const u = j / (n - 1), env = Math.sin(Math.PI * u);
    const fy = bz * env * Math.sin(w * simT + r.ph + 2.1 * u) + ga * env * Math.sin(wa * simT + r.ph2 + 3.3 * u) * (0.6 + 0.4 * Math.sin(wa * 0.37 * simT + r.ph)),
          fz = bz * env * 1.4 * Math.sin(w * 0.73 * simT + r.ph2 - 1.7 * u) + ga * env * 1.3 * Math.sin(wa * 0.81 * simT + r.ph - 2.6 * u);
    for (let a = 0; a < 3; a++) {
      const k = 3 * j + a, v = (p[k] - q[k]) * d; q[k] = p[k]; p[k] += v + (a === 1 ? fy - g : a === 2 ? fz : 0);
    }
  }
  // [§519] the player's place in the room moves the rope's pinned ends forward and back, smoothly
  // [§520 — his "more of a jump rope swing … a cranking motion … the tremolo acceleration achieved through tautness"] THE CRANK: both ends
  // turn in a small circle together (a jump rope's two handles); the turning speed follows the tremolo with inertia (it is pushed up to speed,
  // it coasts down); THE TENSION: the faster it turns, the further the ends pull apart, so the loop narrows as it speeds up
  // [§522 — his "more vigorous, but still give it a different feel … than the ones based on the tremolo"] THE ENSEMBLE'S ROPES ARE SHAKEN:
  // one end moves up and down (alternate ropes from alternate ends), the other is pinned and pulls away with speed; the waves run along the
  // rope. The shaking speeds up EVENLY (its own, slower inertia); its size the written velocity; an accent a SNAP — a moment of extra size
  if (r.pl && r.pl.kind === 'ensemble') {
    const k = Math.min(1, S.ensInertia * dt);
    r.sf += (r.sfT - r.sf) * k; r.sa += (r.saT - r.sa) * Math.min(1, 3 * dt); r.snapK *= Math.exp(-dt * r.ch.snapFade); r.pullC += (r.pullT - r.pullC) * k;
    r.sph += 2 * Math.PI * r.sf * dt;
    const amp = r.sa * (1 + r.snapK), hand = r.side, fixed = hand === 0 ? n - 1 : 0;
    // [§525 — his "slightly more breeze motion, so it's not completely static"] a silent rope's hand drifts slowly with the breeze
    const drift = S.breeze * 0.35 * Math.max(0, 1 - r.sa / 20) * Math.sin(2 * Math.PI * S.breezeHz * simT + r.ph);
    q[3 * hand] = p[3 * hand]; q[3 * hand + 1] = p[3 * hand + 1]; q[3 * hand + 2] = p[3 * hand + 2];
    p[3 * hand] = hand === 0 ? -W / 2 : W / 2; p[3 * hand + 1] = r.y + amp * Math.sin(r.sph) + drift; p[3 * hand + 2] = r.z + amp * r.ch.sway * Math.sin(r.sph * 0.5) + drift * 0.6;
    q[3 * fixed] = p[3 * fixed]; q[3 * fixed + 1] = p[3 * fixed + 1]; q[3 * fixed + 2] = p[3 * fixed + 2];
    p[3 * fixed] = (fixed === 0 ? -1 : 1) * (W / 2 + r.pullC); p[3 * fixed + 1] = r.y; p[3 * fixed + 2] = r.z;
  } else if (r.pl) {
    const k = Math.min(1, S.inertia * dt);
    r.w += (r.wT - r.w) * k; r.pullC += (r.pullT - r.pullC) * k; r.ze += (r.zt - r.ze) * 0.01;
    r.th += 2 * Math.PI * r.w * dt;
    const c = S.crankR * Math.min(1, r.w / Math.max(0.05, S.turnMin));       // a still crank is at rest, not held in a circle
    const ey = r.y + c * Math.sin(r.th), ez = r.ze - c * Math.cos(r.th);
    for (const [j, x] of [[0, -W / 2 - r.pullC], [n - 1, W / 2 + r.pullC]]) {
      q[3 * j] = p[3 * j]; q[3 * j + 1] = p[3 * j + 1]; q[3 * j + 2] = p[3 * j + 2];
      p[3 * j] = x; p[3 * j + 1] = ey; p[3 * j + 2] = ez;
    }
  }
  for (let it = 0; it < ITER; it++) for (let j = 0; j < n - 1; j++) {
    const a = 3 * j, b = a + 3, dx = p[b] - p[a], dy = p[b + 1] - p[a + 1], dz = p[b + 2] - p[a + 2];
    const L = Math.hypot(dx, dy, dz) || 1e-6, diff = (L - r.seg) / L;
    const wa = j === 0 ? 0 : 0.5, wb = j + 1 === n - 1 ? 0 : 0.5, s = wa + wb; if (!s) continue;
    p[a] += dx * diff * wa / s * (s > 0.5 ? 1 : 1); p[a + 1] += dy * diff * wa / s; p[a + 2] += dz * diff * wa / s;
    p[b] -= dx * diff * wb / s; p[b + 1] -= dy * diff * wb / s; p[b + 2] -= dz * diff * wb / s;
  }
}
// a kick: a push up and toward the viewer, strongest at a point, falling off either side (double Dutch: addForce(0, 15000, 7500) at node 15)
function kick(r, at, strength) {
  const { p, q, n } = r, w = S.kickWidth;
  for (let j = 1; j < n - 1; j++) {
    const f = Math.exp(-((j - at) ** 2) / (2 * w * w)) * strength * STEP;
    q[3 * j + 1] -= f; q[3 * j + 2] -= f * 0.5;
  }
}

// ------------------------------------------------------------------ the loop
let acc = 0, last = performance.now(), frame = 0, tPrev = 0;
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  const tNow = audio.currentTime, playing = !audio.paused, jump = Math.abs(tNow - tPrev) > 0.5;
  if (D) for (const r of ropes) {
    if (!r.pl) continue;
    const P = r.pl, on = at(P.on, tNow), sp = at(P.speed, tNow), dp = at(P.depth, tNow), hd = at(P.hardness, tNow);
    r.st = { on, sp, dp, hd };
    r.zt = r.z + (at(P.azimuth, tNow) / 90) * S.roomDepth;
    const busy = Math.max(0, Math.min(1, (sp - 2) / 18)), sounding = Math.min(1, on * 1.5);
    if (P.kind === 'ensemble') {
      r.sfT = playing && sounding > 0.05 ? (S.shakeMin + (S.shakeMax - S.shakeMin) * busy) * r.ch.shake : 0;
      r.saT = playing ? S.shakeAmp * r.ch.amp * sounding * (0.45 + 0.55 * Math.max(0, Math.min(1, (dp - 0.65) / 0.35))) : 0;
      r.pullT = playing ? S.ensPull * sounding * busy : 0;
      if (playing && !jump) for (const a of P.accents) if (a > tPrev && a <= tNow) r.snapK = Math.min(2.5, r.snapK + S.snap * r.ch.snap * (0.5 + 0.5 * Math.max(0, Math.min(1, (hd - 1.5) / 3))));
      continue;
    }
    r.wT = playing ? sounding * (S.turnMin + (S.turnMax - S.turnMin) * busy) * (0.75 + 0.25 * Math.max(0, Math.min(1, (dp - 0.65) / 0.35))) : 0;
    r.pullT = playing ? S.pull * sounding * busy : 0;
    if (playing && !jump) for (const a of P.accents) if (a > tPrev && a <= tNow) {
      const hn = 0.5 + 0.5 * Math.max(0, Math.min(1, (hd - 1.5) / 3));
      r.w += S.accentPush * hn * (P.kind === 'ensemble' ? S.ensPush : 1);                                              // an accent PUSHES the crank, like a push on a swing
      if (S.accentKick) kick(r, R(live, 3, r.n - 4), S.accentKick * hn);
    }
  }
  tPrev = tNow;
  // the stirred air: each shown rope's activity, 0 … 1 — a cranked rope its turning against the fastest, a shaken one its shaking times its size
  { let a = 0, nShown = 0;
    for (const r of ropes) { if (!r.line.visible || !r.pl) continue; nShown++;
      a += r.pl.kind === 'ensemble' ? Math.min(1, (r.sf / Math.max(0.1, S.shakeMax)) * (r.sa / Math.max(1, S.shakeAmp))) : Math.min(1, r.w / Math.max(0.1, S.turnMax)); }
    const want = nShown ? Math.min(1, 2 * a / nShown) : 0; air += (want - air) * Math.min(1, dt * 0.5); }
  while (acc >= STEP) {
    for (const r of ropes) {
      if (live() < S.kickRate * STEP) kick(r, R(live, 2, r.n - 3), S.kick * R(live, 0.6, 1.2));
      stepRope(r, STEP);
    }
    simT += STEP; acc -= STEP;
  }
  frame++;
  for (const r of ropes) {
    if (--r.timer <= 0) {                                   // ofApp: every aniT frames, re-scatter a random number of the rope's tumbleweeds
      r.timer = Math.round(R(live, S.scrL, Math.max(S.scrL, S.scrH)) * r.ch.scr * (r.st ? 1 - S.agitate * r.st.on * Math.max(0, r.st.sp - 2) / 18 * 0.85 : 1));
      const many = Math.round(R(live, 1, r.n - 1));
      for (let k = 0; k < many; k++) {
        const j = Math.floor(live() * r.n), w = r.weeds[j];
        // [his "less agitated"] a re-scramble GLIDES from the old shape to the new one over S.morph frames instead of snapping
        w.from = Float32Array.from(w.pos); w.to = new Float32Array(w.pos.length); scramble(w.to, w.n, weedRad(j, r.n, r.seg, r.ch.size), live); w.k = 0;
      }
    }
    const al = acc / STEP, lp = r.line.geometry.attributes.position.array;     // drawn between the last two physics steps: no judder
    for (let j = 0; j < r.n; j++) {
      // [§520] the quiver of §519 (a drawn standing wave) is gone — his "stiff … almost like it's wire"; the crank above moves the rope now
      const qv = 0;
      const w = r.weeds[j], x = r.q[3 * j] + (r.p[3 * j] - r.q[3 * j]) * al, y = r.q[3 * j + 1] + (r.p[3 * j + 1] - r.q[3 * j + 1]) * al + qv, z = r.q[3 * j + 2] + (r.p[3 * j + 2] - r.q[3 * j + 2]) * al + qv * 0.4;
      w.mesh.position.set(x, y, z); lp[3 * j] = x; lp[3 * j + 1] = y; lp[3 * j + 2] = z;
      if (w.to) {
        w.k = Math.min(1, w.k + 1 / Math.max(1, S.morph * r.ch.morph)); const e = w.k * w.k * (3 - 2 * w.k);
        for (let m = 0; m < w.pos.length; m++) w.pos[m] = w.from[m] + (w.to[m] - w.from[m]) * e;
        w.mesh.geometry.attributes.position.needsUpdate = true; if (w.k >= 1) w.to = w.from = null;
      }
    }
    r.line.geometry.attributes.position.needsUpdate = true;
  }
  bloom.strength = S.bloom; bloom.radius = S.radius; bloom.threshold = S.thresh;
  // [§524 — his "the center is perhaps a little too high … a way to get it pretty centered"] THE FRAME FOLLOWS THE ROPES: the middle of
  // their highest and lowest points, eased slowly, the view moved by the difference (a turned view stays turned)
  let lo = Infinity, hi = -Infinity; for (const r of ropes) if (r.line.visible) for (let j = 0; j < r.n; j += 2) { const y = r.p[3 * j + 1]; if (y < lo) lo = y; if (y > hi) hi = y; }
  if (isFinite(lo)) { const want = (lo + hi) / 2 + S.frameY, dy = (want - controls.target.y) * Math.min(1, dt * 0.6); controls.target.y += dy; camera.position.y += dy; }
  controls.update(); composer.render();
  const t = audio.currentTime; timeEl.textContent = fmt(t); if (!scrubbing) scrub.value = t;
  if (frame % 6 === 0) legend.innerHTML = ropes.filter(r => r.pl).map(r => '<div><span style="color:#' + r.line.material.color.getHexString() + '">■</span> ' + (r.pl.kind === 'session' ? 'electronics · ' + PLAYER_NAMES[r.pl.part] : 'ensemble · ' + r.pl.part) + (r.st && r.st.on > 0.05 ? (r.pl.kind === 'session' ? ' · tremolo ' + r.st.sp.toFixed(1) + ' Hz' : ' · busy ' + Math.round((r.st.sp - 2) / 18 * 100) + '%') + (r.pl.kind === 'ensemble' ? ' · shaking ' + r.sf.toFixed(2) + ' a second' : ' · turning ' + r.w.toFixed(2) + ' a second') : ' · silent') + '</div>').join('');
  requestAnimationFrame(tick);
}

// ------------------------------------------------------------------ the knobs panel
const panel = document.getElementById('panel');
const REBUILD = new Set(['ropes', 'nodes', 'spreadY', 'spreadZ', 'slack', 'ropeSlack', 'ensSlack', 'seed', 'res', 'palette', 'taper', 'sizeL', 'sizeH']);
function knobsHtml() {
  let h = '<h2>Palette</h2><select id="k-palette">' + Object.keys(PALETTES).map(k => '<option value="' + k + '"' + (k === S.palette ? ' selected' : '') + '>' + PALETTE_NAMES[k] + '</option>').join('') + '</select>';
  for (const [title, rows] of KNOBS) {
    h += '<h2>' + title + '</h2>';
    for (const [k, label, a, b, st] of rows) h += '<div class="row"><label for="k-' + k + '">' + label + '</label><input id="k-' + k + '" type="range" min="' + a + '" max="' + b + '" step="' + st + '" value="' + S[k] + '"><output id="o-' + k + '">' + S[k] + '</output></div>';
  }
  h += '<button id="save">Save this look</button><div id="msg"></div><p class="hint">Drag on the picture to turn the view · scroll to zoom · double-click to go back to the front view.</p>';
  return h;
}
panel.innerHTML = knobsHtml();
panel.addEventListener('input', e => {
  const id = e.target.id.replace(/^k-/, ''); if (!(id in S)) return;
  S[id] = id === 'palette' ? e.target.value : +e.target.value;
  const o = document.getElementById('o-' + id); if (o) o.textContent = S[id];
  if (id === 'opacity') ropes.forEach(r => r.weeds.forEach(w => w.mesh.material.opacity = S.opacity * r.ch.op));
  if (id === 'spine') ropes.forEach(r => r.line.material.opacity = S.spine);
  if (REBUILD.has(id)) { build(); applyShow(); }
  if (id === 'frameY') homeCamera();
});
panel.addEventListener('click', async e => {
  if (e.target.id !== 'save') return;
  const r = await fetch('/settings', { method: 'POST', body: JSON.stringify(S) });
  document.getElementById('msg').textContent = r.ok ? 'Saved.' : 'Not saved.';
});
document.getElementById('toggle').onclick = () => panel.classList.toggle('hidden');
renderer.domElement.addEventListener('dblclick', homeCamera);

// ------------------------------------------------------------------ the audio and the time
const legend = document.getElementById('legend'), audio = document.getElementById('audio'), playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
const fmt = t => Math.floor(t / 60) + ':' + (t % 60).toFixed(1).padStart(4, '0');
let scrubbing = false;
playBtn.onclick = () => { if (audio.paused) audio.play(); else audio.pause(); };
audio.onplay = () => playBtn.textContent = 'Pause'; audio.onpause = () => playBtn.textContent = 'Play';
audio.onloadedmetadata = () => scrub.max = audio.duration.toFixed(1);
scrub.oninput = () => { scrubbing = true; timeEl.textContent = fmt(+scrub.value); };
scrub.onchange = () => { audio.currentTime = +scrub.value; scrubbing = false; };
// [§525 — his "can we just turn off the tremolo ones for now? … so I can just see the instruments"] show or hide each family of ropes
S.showElec = S.showElec ?? 1; S.showEns = S.showEns ?? 1;      // [§528 — his "Let's see all the ropes now, please."] (§527 showed the tremolo ones alone)
function applyShow() {
  for (const r of ropes) { const on = !r.pl ? true : r.pl.kind === 'session' ? !!S.showElec : !!S.showEns; r.weeds.forEach(w => w.mesh.visible = on); r.line.visible = on; }
  document.getElementById('showElec').textContent = 'Electronics: ' + (S.showElec ? 'on' : 'off');
  document.getElementById('showEns').textContent = 'Ensemble: ' + (S.showEns ? 'on' : 'off');
}
document.getElementById('showElec').onclick = () => { S.showElec = S.showElec ? 0 : 1; applyShow(); };
document.getElementById('showEns').onclick = () => { S.showEns = S.showEns ? 0 : 1; applyShow(); };
document.getElementById('kick').onclick = () => ropes.forEach(r => kick(r, R(live, 3, r.n - 4), S.kick * 1.5));
window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); playBtn.click(); } });

resize(); build(); applyShow(); requestAnimationFrame(tick);
window.__V = { get ropes() { return ropes; }, camera, S };   // for inspection only
</script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tuplet workshop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; padding: 18px 22px 60px; background: #16181b; color: #e8e6e1; font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #9a968c; margin: 22px 0 8px; font-weight: 600; }
  .top { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
  #clock { font-size: 84px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; min-width: 300px; }
  #clock small { font-size: 28px; color: #9a968c; font-weight: 500; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  button { font: inherit; background: #2a2e34; color: #e8e6e1; border: 1px solid #3a3f47; border-radius: 8px; padding: 7px 13px; cursor: pointer; }
  button:hover { background: #343941; }
  button.big { font-size: 22px; padding: 14px 26px; font-weight: 600; }
  #play { background: #1f5f8b; border-color: #1f5f8b; } #stop { background: #7a2f22; border-color: #7a2f22; }
  input[type=number] { font: inherit; width: 84px; background: #0f1113; color: #e8e6e1; border: 1px solid #3a3f47; border-radius: 6px; padding: 5px 6px; font-variant-numeric: tabular-nums; }
  input.pct { width: 56px; }
  select { font: inherit; background: #0f1113; color: #e8e6e1; border: 1px solid #3a3f47; border-radius: 6px; padding: 5px 6px; }
  canvas { display: block; width: 100%; border-radius: 6px; background: #0f1113; }
  #over { height: 74px; cursor: pointer; } #detail { height: 190px; margin-top: 8px; }
  .dim { color: #9a968c; } #midi { color: #e0a23f; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-weight: 500; color: #9a968c; font-size: 13px; padding: 4px 8px 6px 0; }
  td { padding: 5px 8px 5px 0; vertical-align: middle; border-top: 1px solid #25282d; white-space: nowrap; }
  td.who label { margin-right: 7px; font-size: 13px; } td.who input { vertical-align: -2px; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
  tr.on td { background: #1e2530; }
  .legend span { margin-right: 16px; }
</style></head><body>

<div class="top">
  <div id="clock">277.8<small> s</small></div>
  <div>
    <div class="row">
      <button id="play" class="big">▶ Play</button>
      <button id="stop" class="big">■ Stop</button>
      <label>from <input id="from" type="number" value="277.8" min="270" max="480" step="0.1"> s</label>
      <label>vel <input id="vel" class="pct" type="number" value="100" min="1" max="127" step="1"></label>
    </div>
    <div class="row dim">SPACE plays and stops · LEFT / RIGHT move 1 s (SHIFT 10 s) · click or wheel on either picture · a change is heard while it plays</div>
    <div id="midi"></div>
  </div>
</div>

<h1>The form · the chunks</h1>
<canvas id="over" width="1800" height="74"></canvas>
<canvas id="detail" width="1800" height="190"></canvas>
<div class="row dim legend"><span><i class="sw" style="background:#8a8f98"></i>single strikes</span><span><i class="sw" style="background:#3f8fd0"></i>slow</span><span><i class="sw" style="background:#3fb37a"></i>medium</span><span><i class="sw" style="background:#e0683f"></i>fast</span><span id="stats"></span></div>

<h1>Chunks</h1>
<div class="row">
  <button id="add">+ Add a chunk at the "from" second</button>
  <span id="saved" class="dim"></span>
</div>
<table id="chunks"><thead><tr>
  <th></th><th>start s</th><th>end s</th><th>band</th><th>players</th><th title="how many of the strikes become tuplets: at the chunk's start → at its end">tuplets % start → end</th><th title="the chance a tuplet is kept for the next beat">repeat %</th><th></th>
</tr></thead><tbody></tbody></table>

<script src="tuplets.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
// the seven players' routes (the phase workshop's table): key = the MIDI note sent (74 = D5; the glock sounds two octaves up)
const ROUTE = {
  flute: { short: 'Fl', port: 'SWFluteb', ch: 1, key: 74 }, clarinet: { short: 'Cl', port: 'SWClar', ch: 12, key: 74 }, alto_sax: { short: 'Sx', port: 'SWSaxb', ch: 5, key: 74 },
  glockenspiel: { short: 'Gl', port: 'SWGlock', ch: 9, key: 62 }, piano: { short: 'Pn', port: 'SWPiano', ch: 1, key: 74 },
  violin: { short: 'Vn', port: 'SWViolin', ch: 1, key: 74, cc0: 18 }, cello: { short: 'Vc', port: 'SWCello', ch: 1, key: 74, cc0: 18 },
};
const COLOR = { slow: '#3f8fd0', medium: '#3fb37a', fast: '#e0683f' }, PLAIN = '#8a8f98';
const S = { hits: null, players: [], steps: [], end: 480, t0: 277.8, db: null, mtime: 0, ev: [], per: {}, outs: {}, playing: false, perf0: 0, score0: 0, idx: 0, timer: null, saving: null, dirty: false };

// ---- MIDI
async function midi() {
  if (typeof navigator.requestMIDIAccess !== 'function') { $('midi').textContent = 'this browser has no Web MIDI — open the page in Chrome'; return; }
  try {
    const acc = await navigator.requestMIDIAccess();
    acc.outputs.forEach((o) => { S.outs[o.name.toLowerCase()] = o; });
    const missing = S.players.filter((p) => !S.outs[ROUTE[p].port.toLowerCase()]).map((p) => ROUTE[p].port);
    $('midi').textContent = missing.length ? 'ports not found (is loopMIDI running?): ' + [...new Set(missing)].join(' · ') : '';
  } catch (e) { $('midi').textContent = 'MIDI refused: ' + (e.message || e) + ' — allow MIDI for this page (padlock → MIDI devices)'; }
}
const outOf = (p) => S.outs[ROUTE[p].port.toLowerCase()] || null;
const chOf = (p) => (ROUTE[p].ch - 1) & 15;

// ---- the events: the draw, flattened, each with its length (short enough never to run into the player's next strike)
function rebuild() {
  S.per = Tuplets.build(S.hits, S.players, S.db);
  const ev = [];
  for (const p of S.players) { const a = S.per[p]; for (let i = 0; i < a.length; i++) { const gap = i + 1 < a.length ? a[i + 1].t - a[i].t : 0.3; ev.push({ t: a[i].t, p, dur: Math.max(0.03, Math.min(0.12, gap * 0.6)), band: a[i].plain ? null : a[i].band }); } }
  ev.sort((a, b) => a.t - b.t); S.ev = ev;
  if (S.playing) { const now = scoreNow() + 0.26; let i = 0; while (i < ev.length && ev[i].t < now) i++; S.idx = i; }
  let n = 0; for (const p of S.players) n += S.per[p].length; let single = 0; for (const p of S.players) single += S.hits[p].length;
  $('stats').textContent = single + ' single strikes → ' + n + ' strikes with the chunks';
  draw();
}

// ---- play
const scoreNow = () => S.playing ? S.score0 + (performance.now() - S.perf0) / 1000 : +$('from').value;
function play(from) {
  stop(true);
  const f = from == null ? +$('from').value : from;
  S.score0 = f; S.perf0 = performance.now() + 120; S.playing = true;
  let i = 0; while (i < S.ev.length && S.ev[i].t < f - 0.001) i++; S.idx = i;
  for (const p of S.players) { const o = outOf(p); if (o && ROUTE[p].cc0 != null) o.send([0xB0 | chOf(p), 0, ROUTE[p].cc0]); }
  S.timer = setInterval(tick, 40); tick();
}
function tick() {
  if (!S.playing) return;
  const horizon = scoreNow() + 0.25, vel = Math.max(1, Math.min(127, +$('vel').value || 100));
  while (S.idx < S.ev.length && S.ev[S.idx].t <= horizon) {
    const e = S.ev[S.idx++], o = outOf(e.p); if (!o) continue;
    const at = S.perf0 + (e.t - S.score0) * 1000;
    o.send([0x90 | chOf(e.p), ROUTE[e.p].key, vel], at); o.send([0x80 | chOf(e.p), ROUTE[e.p].key, 0], at + e.dur * 1000);
  }
  if (scoreNow() > S.end + 2) stop();
}
function stop(quiet) {
  if (S.timer) clearInterval(S.timer); S.timer = null;
  if (S.playing && !quiet) $('from').value = Math.max(S.t0 - 2, Math.min(S.end, scoreNow())).toFixed(1);
  S.playing = false;
  for (const p of S.players) { const o = outOf(p); if (!o) continue; try { if (o.clear) o.clear(); } catch (e) {} o.send([0x80 | chOf(p), ROUTE[p].key, 0]); o.send([0xB0 | chOf(p), 123, 0]); }
}

// ---- the pictures
const X0 = () => S.t0 - 2, X1 = () => S.end + 2;
function draw() {
  const c = $('over'), g = c.getContext('2d'), W = c.width, H = c.height; g.clearRect(0, 0, W, H);
  const x = (t) => (t - X0()) / (X1() - X0()) * W;
  S.steps.forEach((st, i) => { g.fillStyle = i % 2 ? '#1b1f24' : '#20252b'; g.fillRect(x(st.from), 0, x(st.to) - x(st.from), 30); g.fillStyle = '#9a968c'; g.font = '12px system-ui'; const w = x(st.to) - x(st.from); if (w > 46) g.fillText(st.label.slice(0, Math.floor(w / 6.4)), x(st.from) + 4, 19); });
  for (const k of S.db.chunks) { g.fillStyle = COLOR[k.band] || PLAIN; g.globalAlpha = (k.players && k.players.length < S.players.length) ? 0.55 : 0.9; g.fillRect(x(k.start), 34, Math.max(2, x(k.end) - x(k.start)), 26); g.globalAlpha = 1; }
  g.fillStyle = '#6b6f76'; g.font = '11px system-ui'; for (let t = 280; t <= 480; t += 10) { g.fillRect(x(t), 62, 1, 5); g.fillText(String(t), x(t) + 3, 72); }
  const now = scoreNow(); g.fillStyle = '#ffd166'; g.fillRect(x(now) - 1, 0, 2, H);
  // the detail: seven rows, 14 s wide, the playhead a quarter in
  const d = $('detail'), q = d.getContext('2d'), DW = d.width, DH = d.height; q.clearRect(0, 0, DW, DH);
  const span = 14, a = now - span * 0.25, dx = (t) => (t - a) / span * DW, rowH = DH / S.players.length;
  for (const k of S.db.chunks) { if (k.end < a || k.start > a + span) continue; q.fillStyle = COLOR[k.band] || PLAIN; q.globalAlpha = 0.13; (k.players || S.players).forEach((p) => { const r = S.players.indexOf(p); q.fillRect(dx(k.start), r * rowH, dx(k.end) - dx(k.start), rowH); }); q.globalAlpha = 1; }
  S.players.forEach((p, r) => {
    q.fillStyle = '#6b6f76'; q.font = '13px system-ui'; q.fillText(ROUTE[p].short, 6, r * rowH + rowH / 2 + 4);
    const ev = S.per[p] || []; for (const e of ev) { if (e.t < a || e.t > a + span) continue; q.fillStyle = e.plain || !e.band ? PLAIN : COLOR[e.band]; q.fillRect(dx(e.t), r * rowH + 5, e.band && !e.plain ? 3 : 4, rowH - 10); }
  });
  q.fillStyle = '#6b6f76'; q.font = '11px system-ui'; for (let t = Math.ceil(a); t < a + span; t++) { q.fillRect(dx(t), DH - 4, 1, 4); if (t % 2 === 0) q.fillText(String(t), dx(t) + 3, DH - 3); }
  q.fillStyle = '#ffd166'; q.fillRect(dx(now) - 1, 0, 2, DH);
}
function frame() { $('clock').innerHTML = scoreNow().toFixed(1) + '<small> s</small>'; if (S.db) { draw(); markRow(); } requestAnimationFrame(frame); }
function markRow() { const now = scoreNow(); document.querySelectorAll('#chunks tbody tr').forEach((tr, i) => { const k = S.db.chunks[i]; tr.classList.toggle('on', !!k && now >= k.start && now < k.end); }); }

// ---- the chunks: the table, the file
function save() {
  S.dirty = true; $('saved').textContent = 'saving…'; clearTimeout(S.saving);
  S.saving = setTimeout(async () => {
    try { const r = await (await fetch('/chunks', { method: 'POST', body: JSON.stringify(S.db) })).json(); if (r.ok) { S.mtime = r.mtime; S.dirty = false; $('saved').textContent = 'saved · bank/tuplet_chunks.json'; } else $('saved').textContent = 'NOT saved: ' + r.error; }
    catch (e) { $('saved').textContent = 'NOT saved: ' + e.message; }
  }, 250);
}
function changed() { S.db.chunks.sort((a, b) => a.start - b.start); rebuild(); save(); }
function table() {
  const tb = document.querySelector('#chunks tbody'); tb.innerHTML = '';
  S.db.chunks.forEach((k, i) => {
    const tr = document.createElement('tr');
    const num = (val, min, max, step, cls, on) => { const e = document.createElement('input'); e.type = 'number'; e.value = val; e.min = min; e.max = max; e.step = step; if (cls) e.className = cls; e.onchange = () => { on(+e.value); changed(); table(); }; return e; };
    const td = (...kids) => { const c = document.createElement('td'); kids.forEach((x) => c.append(x)); tr.append(c); return c; };
    const go = document.createElement('button'); go.textContent = '▶'; go.title = 'play from 2 s before this chunk'; go.onclick = () => { $('from').value = Math.max(S.t0 - 2, k.start - 2).toFixed(1); play(); };
    td(go);
    td(num(k.start, 270, 480, 0.1, '', (v) => { k.start = v; if (k.end <= v) k.end = +(v + 1).toFixed(1); }));
    td(num(k.end, 270, 482, 0.1, '', (v) => { k.end = Math.max(v, k.start + 0.2); }));
    const sel = document.createElement('select'); Object.keys(S.db.bands).forEach((b) => { const o = document.createElement('option'); o.value = b; o.textContent = b + ' (' + S.db.bands[b][0] + '–' + S.db.bands[b][1] + '/s)'; sel.append(o); }); sel.value = k.band; sel.style.borderLeft = '8px solid ' + (COLOR[k.band] || PLAIN); sel.onchange = () => { k.band = sel.value; changed(); table(); };
    td(sel);
    const who = td(); who.className = 'who';
    const allB = document.createElement('button'); allB.textContent = 'all'; allB.style.padding = '2px 8px'; allB.style.marginRight = '8px'; allB.onclick = () => { k.players = S.players.slice(); changed(); table(); }; who.append(allB);
    S.players.forEach((p) => { const l = document.createElement('label'), cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !k.players || k.players.indexOf(p) >= 0; cb.onchange = () => { const set = new Set(k.players || S.players); if (cb.checked) set.add(p); else set.delete(p); k.players = S.players.filter((x) => set.has(x)); changed(); }; l.append(cb, ' ' + ROUTE[p].short); who.append(l); });
    const arrow = document.createElement('span'); arrow.textContent = ' → '; arrow.className = 'dim';
    td(num(Math.round((k.shareFrom == null ? 1 : k.shareFrom) * 100), 0, 100, 5, 'pct', (v) => { k.shareFrom = v / 100; }), arrow, num(Math.round((k.shareTo == null ? (k.shareFrom == null ? 1 : k.shareFrom) : k.shareTo) * 100), 0, 100, 5, 'pct', (v) => { k.shareTo = v / 100; }));
    td(num(Math.round((k.hold == null ? 0.45 : k.hold) * 100), 0, 100, 5, 'pct', (v) => { k.hold = v / 100; }));
    const nd = document.createElement('button'); nd.textContent = 'new draw'; nd.title = 'another choice of tuplets inside the same band'; nd.onclick = () => { k.seed = (k.seed || 1) + 1; changed(); };
    const del = document.createElement('button'); del.textContent = '×'; del.title = 'remove this chunk (its strikes go back to singles)'; del.onclick = () => { S.db.chunks.splice(i, 1); changed(); table(); };
    td(nd, ' ', del);
    tb.append(tr);
  });
}
$('add').onclick = () => {
  const start = +(+$('from').value).toFixed(1), id = 'c' + (1 + S.db.chunks.reduce((m, k) => Math.max(m, +String(k.id).replace(/\D/g, '') || 0), 0));
  S.db.chunks.push({ id, start, end: +(start + 3).toFixed(1), band: 'medium', players: S.players.slice(), shareFrom: 1, shareTo: 1, hold: 0.45, seed: 1 });
  changed(); table();
};
async function loadChunks() { const r = await (await fetch('/chunks')).json(); S.db = r.db; S.mtime = r.mtime; S.db.chunks.forEach((k, i) => { if (!k.id) k.id = 'c' + (i + 1); }); }
setInterval(async () => {   // the file changed on disk (the AI wrote chunks): take it, unless this page has an unsaved change of its own
  if (S.dirty || !S.db || document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.type === 'number' && document.activeElement.closest('#chunks')) return;
  try { const r = await (await fetch('/chunks')).json(); if (r.mtime && r.mtime !== S.mtime) { S.db = r.db; S.mtime = r.mtime; rebuild(); table(); $('saved').textContent = 'reloaded from the file'; } } catch (e) {}
}, 1500);

// ---- wiring
$('play').onclick = () => play(); $('stop').onclick = () => stop();
$('over').onclick = (e) => { const r = $('over').getBoundingClientRect(), t = X0() + (e.clientX - r.left) / r.width * (X1() - X0()); $('from').value = t.toFixed(1); if (S.playing) play(); };
// moving about (his word 2026-11-18): LEFT / RIGHT 1 s (SHIFT 10 s) · the wheel over either picture · a click in the close view
function nudge(d) { const t = Math.max(S.t0 - 2, Math.min(S.end, scoreNow() + d)); $('from').value = t.toFixed(1); if (S.playing) play(); }
$('detail').onclick = (e) => { const r = $('detail').getBoundingClientRect(), a = scoreNow() - 14 * 0.25; $('from').value = Math.max(S.t0 - 2, Math.min(S.end, a + (e.clientX - r.left) / r.width * 14)).toFixed(1); if (S.playing) play(); };
['over', 'detail'].forEach((id) => $(id).addEventListener('wheel', (e) => { e.preventDefault(); nudge((e.deltaY > 0 ? 1 : -1) * (id === 'over' ? 5 : 1)); }, { passive: false }));
document.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); S.playing ? stop() : play(); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); nudge(e.shiftKey ? 10 : 1); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); nudge(e.shiftKey ? -10 : -1); }
});
(async function () {
  const h = await (await fetch('/hits')).json(); S.hits = h.hits; S.players = h.players; S.steps = h.steps; S.end = h.end; S.t0 = h.steps[0].from;
  await loadChunks(); rebuild(); table(); await midi(); requestAnimationFrame(frame);
})();
</script>
</body></html>
